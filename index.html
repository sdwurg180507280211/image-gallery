<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="description" content="人物作品、医药KV与公众号样式的个人视觉素材库。" />
  <title>Visual Asset Library</title>
  <link rel="stylesheet" href="./assets/styles.css?v=6" />
  <link rel="stylesheet" href="./assets/interactions.css?v=1" />
  <link rel="stylesheet" href="./assets/viewer.css?v=4" />
  <link rel="stylesheet" href="./assets/wechat-library.css?v=2" />
  <link rel="stylesheet" href="./assets/curation.css?v=2" />
  <link rel="stylesheet" href="./assets/library.css?v=1" />
</head>
<body>
  <header class="site-header compact-header">
    <nav class="domain-tabs header-tabs" role="tablist" aria-label="素材类型">
      <button class="domain-tab active" data-domain="character" type="button" role="tab" aria-selected="true"><span>人物图片</span><small id="characterTabCount">0</small></button>
      <button class="domain-tab" data-domain="medical-kv" type="button" role="tab" aria-selected="false"><span>医药KV</span><small id="kvTabCount">0</small></button>
      <button class="domain-tab" data-domain="wechat" type="button" role="tab" aria-selected="false"><span>公众号</span><small>26</small></button>
    </nav>
    <button class="icon-button" id="themeToggle" type="button" aria-label="切换主题">◐</button>
  </header>

  <main class="library-shell">
    <section class="library-panel">
      <div id="assetLibraryView">
        <div class="toolbar">
          <div class="search-box" role="search">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" aria-label="搜索素材" placeholder="搜索人物标题或关键词…" autocomplete="off" />
            <button class="search-clear" id="clearSearch" type="button" aria-label="清除搜索" hidden>×</button>
          </div>
          <div class="toolbar-actions">
            <select id="sortSelect" aria-label="排序方式">
              <option value="newest">最新优先</option>
              <option value="oldest">最早优先</option>
              <option value="title">标题排序</option>
            </select>
            <button class="text-button" id="favoritesOnly" type="button" aria-pressed="false">♡ 收藏</button>
            <button class="text-button" id="dislikedOnly" type="button" aria-pressed="false">👎 不喜欢</button>
          </div>
        </div>

        <section id="characterFilters" class="filter-strip">
          <span class="filter-label">分类</span>
          <div class="chip-row" id="characterCategoryFilters"></div>
        </section>

        <section id="medicalFilters" class="filter-strip" hidden>
          <span class="filter-label">主色</span>
          <div class="chip-row" id="colorFilters"></div>
        </section>

        <div class="result-meta">
          <div>
            <p id="resultText">正在读取素材…</p>
            <div class="active-filter-row" id="activeFilters" aria-label="当前筛选条件"></div>
          </div>
          <button class="text-button compact" id="clearFilters" type="button" hidden>清除筛选</button>
        </div>

        <div class="gallery-grid" id="galleryGrid" aria-live="polite"></div>
        <div class="empty-state" id="emptyState" hidden>
          <strong>没有匹配素材</strong>
          <p>减少筛选条件或换一个关键词。</p>
        </div>
      </div>

      <section id="wechatLibraryView" hidden>
        <div class="wechat-library-toolbar">
          <div class="wechat-chips" id="wechatChips"></div>
          <input class="wechat-search" id="wechatSearch" type="search" aria-label="搜索公众号样式" placeholder="搜索样式编号或名称，例如：标题-01" autocomplete="off" />
        </div>
        <div class="wechat-grid" id="wechatGrid"></div>
        <div class="wechat-empty" id="wechatEmpty" hidden>没有匹配的样式。</div>
      </section>
    </section>
  </main>

  <dialog class="lightbox" id="lightbox" aria-label="原尺寸大图查看">
    <div class="viewer-stage" id="lightboxStage">
      <div class="viewer-loader" aria-hidden="true"></div>
      <img id="lightboxImage" draggable="false" alt="" />
    </div>

    <header class="viewer-topbar">
      <div class="viewer-context">
        <span id="lightboxCounter"></span>
        <span class="viewer-divider" aria-hidden="true"></span>
        <span id="lightboxMeta"></span>
      </div>
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="关闭">×</button>
    </header>

    <button class="lightbox-nav previous" id="previousImage" type="button" aria-label="上一张">‹</button>
    <button class="lightbox-nav next" id="nextImage" type="button" aria-label="下一张">›</button>

    <div class="viewer-caption">
      <div class="viewer-caption-copy">
        <span class="viewer-status" id="lightboxStatus" hidden></span>
        <h2 id="lightboxTitle"></h2>
      </div>
      <div class="lightbox-actions">
        <button class="secondary-button" id="lightboxFavorite" type="button">♡ 收藏</button>
        <button class="secondary-button dislike-button" id="lightboxDislike" type="button" aria-pressed="false">👎 不喜欢</button>
        <button class="secondary-button" id="lightboxPrompt" type="button" hidden>提示词</button>
        <a class="primary-button" id="downloadImage" href="#" download>下载原图</a>
      </div>
    </div>

    <section class="prompt-panel" id="promptPanel" hidden aria-label="图片提示词">
      <div class="prompt-sheet">
        <header class="prompt-sheet-header">
          <div>
            <small id="promptKindLabel"></small>
            <strong id="promptPanelTitle"></strong>
          </div>
          <button class="prompt-close" id="promptPanelClose" type="button" aria-label="关闭提示词">×</button>
        </header>
        <pre id="promptText"></pre>
        <footer class="prompt-sheet-actions">
          <button id="copyPrompt" type="button">复制提示词</button>
        </footer>
      </div>
    </section>
  </dialog>

  <template id="cardTemplate">
    <article class="gallery-card">
      <button class="image-button" type="button">
        <img loading="lazy" decoding="async" alt="" />
        <span class="image-overlay">查看大图</span>
      </button>
      <div class="card-body">
        <div class="card-copy"><p class="card-meta"></p><h2 class="card-title"></h2></div>
        <div class="card-actions">
          <button class="dislike-button" type="button" aria-label="标记不喜欢" aria-pressed="false">👎</button>
          <button class="favorite-button" type="button" aria-label="收藏" aria-pressed="false">♡</button>
        </div>
      </div>
    </article>
  </template>

  <script type="module" src="./assets/app.js?v=12"></script>
  <script type="module" src="./assets/wechat-library.js?v=4"></script>
  <script type="module" src="./assets/interactions.js?v=1"></script>
</body>
</html>
