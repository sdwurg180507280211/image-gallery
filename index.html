<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="description" content="人物作品与医药KV的个人视觉素材库。" />
  <title>Visual Asset Library</title>
  <link rel="stylesheet" href="./assets/styles.css?v=5" />
  <link rel="stylesheet" href="./assets/interactions.css?v=1" />
  <link rel="stylesheet" href="./assets/viewer.css?v=3" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="返回素材库首页">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span><strong>Visual Asset Library</strong><small>人物作品 · 医药KV</small></span>
    </a>
    <button class="icon-button" id="themeToggle" type="button" aria-label="切换主题">◐</button>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">PERSONAL VISUAL ARCHIVE</p>
        <h1>把生成的好素材，<span>真正沉淀下来。</span></h1>
        <p>人物图按服装主色或多宫图整理；医药KV按主色、主器官与使用状态快速筛选。原图保留，列表只加载缩略图。</p>
      </div>
      <div class="stats">
        <div><strong id="assetCount">0</strong><span>张素材</span></div>
        <div><strong id="characterCount">0</strong><span>人物图</span></div>
        <div><strong id="kvCount">0</strong><span>医药KV</span></div>
      </div>
    </section>

    <section class="library-panel">
      <div class="domain-tabs" role="tablist" aria-label="素材类型">
        <button class="domain-tab active" data-domain="character" type="button" role="tab" aria-selected="true"><span>人物图片</span><small id="characterTabCount">0</small></button>
        <button class="domain-tab" data-domain="medical-kv" type="button" role="tab" aria-selected="false"><span>医药KV</span><small id="kvTabCount">0</small></button>
      </div>

      <div class="toolbar">
        <div class="search-box" role="search">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" aria-label="搜索素材" placeholder="搜索人物标题或关键词…" autocomplete="off" />
          <button class="search-clear" id="clearSearch" type="button" aria-label="清除搜索" hidden>×</button>
        </div>
        <div class="toolbar-actions">
          <select id="sortSelect" aria-label="排序方式">
            <option value="newest">最新优先</option>
            <option value="oldest">最早优先</option>
            <option value="title">标题排序</option>
          </select>
          <button class="text-button" id="favoritesOnly" type="button" aria-pressed="false">♡ 只看收藏</button>
        </div>
      </div>

      <section id="characterFilters" class="filter-block">
        <div class="facet-header"><span>分类</span><small>按主要视觉特征归档</small></div>
        <div class="chip-row" id="characterCategoryFilters"></div>
      </section>

      <section id="medicalFilters" class="filter-block medical-filters" hidden>
        <div class="facet-row">
          <div class="facet-header"><span>主色</span><small>只保留当前库里实际存在的颜色</small></div>
          <div class="chip-row" id="colorFilters"></div>
        </div>
        <div class="facet-row">
          <div class="facet-header"><span>主器官</span><small>一个KV只归到一个主器官</small></div>
          <div class="chip-row" id="organFilters"></div>
        </div>
        <div class="facet-row usage-row">
          <div class="facet-header"><span>使用状态</span><small>用于筛选可继续使用的KV</small></div>
          <div class="segmented-control" id="usageFilters" aria-label="使用状态筛选"></div>
        </div>
      </section>

      <div class="result-meta">
        <div>
          <p id="resultText">正在读取素材…</p>
          <div class="active-filter-row" id="activeFilters" aria-label="当前筛选条件"></div>
        </div>
        <button class="text-button compact" id="clearFilters" type="button" hidden>清除筛选</button>
      </div>

      <div class="gallery-grid" id="galleryGrid" aria-live="polite"></div>
      <div class="empty-state" id="emptyState" hidden>
        <strong>没有匹配素材</strong>
        <p>减少筛选条件或换一个关键词。</p>
      </div>
    </section>
  </main>

  <dialog class="lightbox" id="lightbox" aria-label="原尺寸大图查看">
    <div class="viewer-stage" id="lightboxStage">
      <div class="viewer-loader" aria-hidden="true"></div>
      <img id="lightboxImage" draggable="false" alt="" />
    </div>

    <header class="viewer-topbar">
      <div class="viewer-context">
        <span id="lightboxCounter"></span>
        <span class="viewer-divider" aria-hidden="true"></span>
        <span id="lightboxMeta"></span>
      </div>
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="关闭">×</button>
    </header>

    <button class="lightbox-nav previous" id="previousImage" type="button" aria-label="上一张">‹</button>
    <button class="lightbox-nav next" id="nextImage" type="button" aria-label="下一张">›</button>

    <div class="viewer-caption">
      <div class="viewer-caption-copy">
        <span class="viewer-status" id="lightboxStatus" hidden></span>
        <h2 id="lightboxTitle"></h2>
      </div>
      <div class="lightbox-actions">
        <button class="secondary-button" id="lightboxFavorite" type="button">♡ 收藏</button>
        <a class="primary-button" id="downloadImage" href="#" download>下载原图</a>
      </div>
    </div>
  </dialog>

  <template id="cardTemplate">
    <article class="gallery-card">
      <button class="image-button" type="button">
        <img loading="lazy" decoding="async" alt="" />
        <span class="image-overlay">查看大图</span>
        <span class="usage-badge" hidden></span>
      </button>
      <div class="card-body">
        <div class="card-copy"><p class="card-meta"></p><h2 class="card-title"></h2><p class="card-dimensions"></p></div>
        <button class="favorite-button" type="button" aria-label="收藏">♡</button>
      </div>
      <div class="admin-card-actions"></div>
    </article>
  </template>

  <script type="module" src="./assets/app.js?v=8"></script>
  <script type="module" src="./assets/admin.js?v=5"></script>
  <script type="module" src="./assets/interactions.js?v=1"></script>
</body>
</html>
