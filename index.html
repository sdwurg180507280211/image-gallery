<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="description" content="一个用于整理、浏览和展示生成式人物模型图片的通用图片画廊。" />
  <title>Image Gallery</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <link rel="stylesheet" href="./assets/v2.css" />
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="./" aria-label="返回画廊首页">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" role="img"><path d="M6 5h20a3 3 0 0 1 3 3v16a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Zm0 3v12.3l5.2-5.2a2 2 0 0 1 2.8 0l3.2 3.2 2.1-2.1a2 2 0 0 1 2.8 0l3.9 3.9V8H6Zm20 16v-.7l-5.3-5.3-3.5 3.5-4.6-4.6L6 23.5v.5h20ZM11 10a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"/></svg>
      </span>
      <span>
        <strong>Image Gallery</strong>
        <small>人物模型图片收藏馆</small>
      </span>
    </a>
    <button class="icon-button" id="themeToggle" type="button" aria-label="切换明暗主题" title="切换主题">
      <span class="theme-icon" aria-hidden="true">◐</span>
    </button>
  </header>

  <main>
    <section class="hero" aria-labelledby="heroTitle">
      <div class="hero-copy">
        <p class="eyebrow">GENERATED CHARACTER ARCHIVE</p>
        <h1 id="heroTitle">让每一张角色作品，<br /><span>都被好好收藏。</span></h1>
        <p class="hero-description">按人物、主题、场景、配色、构图和资产类型整理作品；原图保留，首页自动加载轻量缩略图。</p>
      </div>
      <div class="stats" aria-label="画廊统计">
        <div class="stat"><strong id="imageCount">0</strong><span>张作品</span></div>
        <div class="stat"><strong id="categoryCount">0</strong><span>个人物</span></div>
        <div class="stat"><strong id="favoriteCount">0</strong><span>个收藏</span></div>
      </div>
    </section>

    <section class="gallery-panel" aria-label="图片画廊">
      <div class="toolbar">
        <label class="search-box" for="searchInput">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
          <input id="searchInput" type="search" placeholder="搜索标题、人物、主题、场景或标签…" autocomplete="off" />
          <kbd>/</kbd>
        </label>
        <div class="toolbar-actions">
          <label class="select-wrap sort-control">
            <span class="sort-label">排序</span>
            <select id="sortSelect" aria-label="排序方式">
              <option value="newest">最新优先</option>
              <option value="oldest">最早优先</option>
              <option value="title">标题排序</option>
            </select>
          </label>
          <button class="text-button" id="favoritesOnly" type="button" aria-pressed="false">♡ 只看收藏</button>
        </div>
      </div>

      <div class="filter-section">
        <p class="filter-label">人物</p>
        <div class="category-row" id="categoryFilters" aria-label="人物筛选"></div>
      </div>

      <div class="filter-heading">
        <div>
          <p class="filter-label">内容筛选</p>
          <p class="filter-hint">先按主题、场景和配色缩小范围</p>
        </div>
      </div>

      <div class="facet-grid primary-facets" aria-label="主要筛选">
        <label class="facet-control">
          <span>✦ 主题</span>
          <select id="themeFilter" data-label="主题"><option value="全部">全部主题</option></select>
        </label>
        <label class="facet-control">
          <span>◇ 场景</span>
          <select id="sceneFilter" data-label="场景"><option value="全部">全部场景</option></select>
        </label>
        <label class="facet-control">
          <span>◐ 配色</span>
          <select id="paletteFilter" data-label="配色"><option value="全部">全部配色</option></select>
        </label>
      </div>

      <div class="advanced-disclosure">
        <button class="advanced-toggle" id="advancedToggle" type="button" aria-expanded="false" aria-controls="advancedFilters">
          <span class="advanced-toggle-copy">
            <strong>更多筛选</strong>
            <small>构图、资产类型</small>
          </span>
          <span class="advanced-toggle-meta">
            <span id="advancedCount" hidden>0</span>
            <svg class="toggle-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7.5 5 5 5-5" /></svg>
          </span>
        </button>

        <div class="advanced-filters" id="advancedFilters" hidden>
          <div class="facet-grid secondary-facets" aria-label="更多筛选">
            <label class="facet-control">
              <span>▣ 构图</span>
              <select id="compositionFilter" data-label="构图"><option value="全部">全部构图</option></select>
            </label>
            <label class="facet-control">
              <span>◫ 资产类型</span>
              <select id="assetTypeFilter" data-label="类型"><option value="全部">全部类型</option></select>
            </label>
          </div>
        </div>
      </div>

      <div class="active-filter-row" id="activeFilters" aria-label="已选筛选条件" hidden></div>

      <div class="result-meta">
        <p id="resultText">正在读取图片索引…</p>
        <button class="text-button compact" id="clearFilters" type="button" hidden>清除筛选</button>
      </div>

      <div class="gallery-grid" id="galleryGrid" aria-live="polite"></div>

      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-icon" aria-hidden="true">✦</div>
        <h2 id="emptyTitle">画廊还是空的</h2>
        <p id="emptyDescription">把图片放入 <code>images/</code> 文件夹并推送，网站会自动生成索引。</p>
        <a class="primary-button" href="https://github.com/sdwurg180507280211/image-gallery/tree/main/images" target="_blank" rel="noreferrer">前往上传图片</a>
      </div>
    </section>
  </main>

  <footer><p>Built for generated artwork · Powered by GitHub Pages</p></footer>

  <dialog class="lightbox" id="lightbox">
    <div class="lightbox-shell">
      <button class="lightbox-close icon-button" id="lightboxClose" type="button" aria-label="关闭预览">×</button>
      <button class="lightbox-nav previous" id="previousImage" type="button" aria-label="上一张图片">‹</button>
      <figure>
        <div class="lightbox-stage"><img id="lightboxImage" alt="" /></div>
        <figcaption>
          <div>
            <p class="lightbox-category" id="lightboxCategory"></p>
            <h2 id="lightboxTitle"></h2>
            <p id="lightboxDescription"></p>
          </div>
          <div class="lightbox-actions">
            <button class="secondary-button" id="lightboxFavorite" type="button">♡ 收藏</button>
            <a class="primary-button" id="downloadImage" href="#" download>下载原图</a>
          </div>
        </figcaption>
      </figure>
      <button class="lightbox-nav next" id="nextImage" type="button" aria-label="下一张图片">›</button>
    </div>
  </dialog>

  <template id="cardTemplate">
    <article class="gallery-card">
      <button class="image-button" type="button">
        <img loading="lazy" decoding="async" alt="" />
        <span class="image-overlay" aria-hidden="true"><span>查看大图</span></span>
      </button>
      <div class="card-body">
        <div class="card-copy">
          <p class="card-category"></p>
          <h2 class="card-title"></h2>
        </div>
        <button class="favorite-button" type="button" aria-label="收藏图片" aria-pressed="false">♡</button>
      </div>
      <div class="tag-list"></div>
    </article>
  </template>

  <script type="module" src="./assets/app.js"></script>
</body>
</html>
