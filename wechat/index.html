ine);border-radius:var(--radius);background:var(--surface);overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line)}.card-id{font-size:15px;font-weight:760}.card-name{color:var(--muted);font-size:12px;margin-top:2px}.copy{border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);padding:8px 11px;white-space:nowrap}.copy:hover{border-color:var(--accent);color:#fff}.copy.done{background:var(--accent);border-color:var(--accent);color:#fff}.preview-shell{background:#e9ebef;padding:18px;min-height:150px;display:flex;align-items:center;justify-content:center;overflow:auto}.preview{width:min(677px,100%);background:#fff;color:#3E3E3E;padding:18px;min-height:100px;overflow:hidden}.preview img{max-width:100%;height:auto}.empty{padding:50px;text-align:center;color:var(--muted)}.note{margin-top:20px;color:var(--muted);font-size:12px}@media(max-width:820px){.grid{grid-template-columns:1fr}.topbar{padding-inline:16px}main{padding-inline:14px}.preview-shell{padding:10px}.preview{padding:14px}}
</style></head><body><header class="topbar"><a class="brand" href="../"><span class="mark">✦</span><span><strong>Visual Asset Library</strong><small>公众号样式库</small></span></a><a class="back" href="../">← 返回素材库</a></header><main><section class="hero"><p class="eyebrow">WECHAT STYLE LIBRARY</p><h1>公众号样式库</h1><p>选择喜欢的样式编号，后续直接告诉我编号即可。页面只展示实际效果，并提供可直接复制的 inline HTML。</p></section><section class="toolbar"><div class="chips" id="chips"></div><input class="search" id="search" type="search" placeholder="搜索样式编号或名称，例如：标题-01"></section><section class="grid" id="grid"></section><div class="empty" id="empty" hidden>没有匹配的样式。</div><p class="note">图片组件均来自已入库的医荟她健康品牌素材；复制 HTML 后可直接复用。</p></main><script>

g:1px;text-align:justify;color:#3E3E3E;\"><p style=\"margin:0;\">这是正文示例。字号克制、行距稳定，重点依靠段落逻辑与加粗，而不是不断增加视觉组件。</p></section></section>"},{"id":"正文-03","category":"正文","name":"15px / 1.8 / 0.5px 字距","html":"<section style=\"font-size:15px;line-height:1.8;letter-spacing:.5px;text-align:justify;color:#3E3E3E;width:100%;\"><p style=\"margin:0;\">这里放较密集的说明文字，适合导语、摘要或需要更紧凑阅读节奏的段落。</p></section>"},{"id":"正文-04","category":"正文","name":"访谈黑字基线","html":"<section style=\"font-size:15px;line-height:1.8;text-align:justify;color:#000;\"><p style=\"margin:0;\"><strong>专家：</strong>这里放专家回答正文，保持清晰、克制的阅读节奏。</p></section>"},{"id":"标题-01","category":"标题","name":"白色圆角大章节卡","html":"<section style=\"display:flex;align-items:center;margin:30px 0 20px;padding:10px;background:#fff;border-top:1px solid #FDF1F4;border-radius:20px;box-shadow:#F24D60 1px 2px 0 0;\"><section style=\"width:20%;display:flex;justify-content:center;\"><span style=\"display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:8px;background:linear-gradient(135deg,#FD495D,rgba(242,77,96,.25));color:#fff;font-size:21px;font-weight:700;\">1</span></section><section style=\"width:80%;font-size:18px;line-height:1.5;color:#333;font-weight:700;\">章节标题示例</section></section>"},{"id":"标题-02","category":"标题","name":"软粉横条 + 编号","html":"<section style=\"display:flex;align-items:stretch;margin:20px 0 10px;\"><section style=\"display:flex;width:98%;background:#FFEEEA;padding:10px 20px;\"><section style=\"width:15%;font-size:24px;color:#5F401C;font-weight:700;\">01</section><section style=\"width:85%;align-self:center;color:#4D2F0D;line-height:1.8;font-weight:700;\">章节标题示例</section></section><span style=\"width:16px;height:16px;margin-left:-16px;align-self:flex-end;border:8px solid transparent;border-top-color:#F24D60;border-left-color:#F24D60;\"></span></section>"},{"id":"标题-03","category":"标题","name":"粉色下划线编号","html":"<section style=\"display:flex;align-items:flex-start;margin:20px 0 10px;\"><sectio span></section><section style=\"display:flex;margin:15px 0;transform:translate3d(-10px,0,0);\"><span style=\"display:inline-flex;width:1.8em;height:1.8em;align-items:center;justify-content:center;background:#F24D60;color:#fff;border-radius:100%;font-size:12px;margin-right:12px;\">2</span><span style=\"font-size:15px;line-height:1.8;\">第二项结果或行动要点。</span></section></section></section>"},{"id":"访谈-01","category":"访谈","name":"左右气泡","html":"<section style=\"margin:18px 0 28px;\"><section style=\"display:flex;align-items:flex-start;margin-bottom:8px;\"><div style=\"width:50px;height:50px;border-radius:50%;background:#F24D60;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 50px;\">问</div><section style=\"padding:10px 20px;background:#F2F2F2;flex:1;margin:20px 15px 0 -20px;border-radius:5px;font-size:15px;line-height:1.8;color:#000;\"><strong>主持人：</strong>这里放访谈提问。</section></section><section style=\"display:flex;align-items:flex-start;flex-direction:row-reverse;\"><div style=\"width:50px;height:50px;border-radius:50%;background:#F24D60;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 50px;\">答</div><section style=\"padding:15px 20px;background:#F2F2F2;flex:1;margin:20px -20px 0 15px;border-radius:5px;font-size:15px;line-height:1.8;color:#000;\"><strong>专家：</strong>这里放专家回答。</section></section></section>"},{"id":"图片-01","category":"图片","name":"医荟她健康 Logo｜心形女性与医疗十字","html":"<section style=\"text-align:center;margin:12px 0;\"><img src=\"https://sdwurg180507280211.github.io/image-gallery/images/wechat/yihui-she-health/yihui-she-health-logo-heart-mother.png\" alt=\"医荟她健康 Logo｜心形女性与医疗十字\" style=\"display:block;width:100%;max-width:560px;height:auto;margin:0 auto;\"></section>"},{"id":"图片-02","category":"图片","name":"医荟她健康 Logo｜爱心飘带女性","html":"<section style=\"text-align:center;margin:12px 0;\"><img src=\"https://sdwurg180507280211.github.io/image-gallery/images/wechat/yihui-she-health/yihui-she-health-logo-heart-ribbon.png\" alt=\"医荟她健康 Logo｜爱心飘带女性\" style=\"display:block;width:100%;max-width:560px;height:auto;margin:0 auto;\"></section>"},{"id":"图片-03","category":"图片","name":"医荟她健康 Logo｜母女圆形徽章","html":"<section style=\"text-align:center;margin:12px 0;\"><img src=\"https://sdwurg180507280211.github.io/image-gallery/images/wechat/yihui-she-health/yihui-she-health-logo-mother-child-round.png\" alt=\"医荟她健康 Logo｜母女圆形徽章\" style=\"display:block;width:100%;max-width:520px;height:auto;margin:0 auto;\"></section>"},{"id":"图片-04","category":"图片","name":"医荟她健康 Logo｜女性花瓣标识","html":"<section style=\"text-align:center;margin:12px 0;\"><img src=\"https://sdwurg180507280211.github.io/image-gallery/images/wechat/yihui-she-health/yihui-she-health-logo-female-floral.png\" alt=\"医荟她健康 Logo｜女性花瓣标识\" style=\"display:block;width:100%;max-width:560px;height:auto;margin:0 auto;\"></section>"},{"id":"图片-05","category":"图片","name":"医荟她健康｜马年横版 KV","html":"<section style=\"line-height:0;margin:0;\"><img src=\"https://sdwurg180507280211.github.io/image-gallery/images/wechat/yihui-she-health/yihui-she-health-kv-horizontal-horse-year.png\" alt=\"医荟她健康 马年横版 KV\" style=\"display:block;width:100%;max-width:100%;height:auto;margin:0;\"></section>"},{"id":"图片-06","category":"图片","name":"医荟她健康｜马年竖版 KV","html":"<section style=\"text-align:center;line-height:0;margin:0;\"><img src=\"https://sdwurg180507280211.github.io/image-gallery/images/wechat/yihui-she-health/yihui-she-health-kv-vertical-horse-year.png\" alt=\"医荟她健康 马年竖版 KV\" style=\"display:block;width:100%;max-width:480px;height:auto;margin:0 auto;\"></section>"},{"id":"参考文献-01","category":"参考文献","name":"Reference + 滚动列表","html":"<section style=\"padding:5px 10px;\"><section style=\"display:flex;align-items:flex-end;\"><div style=\"display:flex;align-items:flex-end;gap:1px;flex:1;\"><i style=\"display:block;width:5px;height:23px;background:#F24D60;\"></i><i style=\"display:block;width:4px;height:18px;background:#F24D60;\"></i><i style=\"display:block;width:4px;height:20px;background:#F24D60;\"></i><i style=\"display:block;width:4px;height:26px;background:#F24D60;transform:rotate(4deg);\"></i></div><span style=\"font-size:12px;color:#000;letter-spacing:2px;\">Reference</span></section><div style=\"height:1px;background:#A0A0A0;\"></div><div style=\"font-size:14px;color:#000;letter-spacing:2px;margin-top:5px;\"><b>参考文献：</b></div><section style=\"width:100%;height:240px;overflow-y:auto;margin-top:8px;\"><ol style=\"padding-left:22px;margin:0;font-size:12px;line-height:1.8;color:#6F6E6E;\"><li>示例参考文献 A……</li><li>示例参考文献 B……</li><li>示例参考文献 C……</li><li>示例参考文献 D……</li><li>示例参考文献 E……</li></ol></section></section>"},{"id":"参考文献-02","category":"参考文献","name":"简单灰色列表","html":"<section style=\"margin:20px 0;\"><section style=\"text-align:left;font-size:12px;color:#A0A0A0;line-height:1.8;\"><p style=\"margin:0;\"><strong>参考文献：</strong></p><ol style=\"padding-left:20px;margin:6px 0 0;\"><li>示例文献一。</li><li>示例文献二。</li><li>示例文献三。</li></ol></section></section>"},{"id":"结尾-01","category":"结尾","name":"END 红线","html":"<section><div style=\"height:2px;background:#FF4545;margin-top:10px;\"></div><div style=\"text-align:center;margin-top:-12px;\"><span style=\"display:inline-block;background:#fff;color:#FF4545;font-weight:700;letter-spacing:1px;padding:0 10px;\">END</span></div></section>"},{"id":"结尾-02","category":"结尾","name":"免责声明 / 编辑信息","html":"<section style=\"margin:20px 0 0;\"><section style=\"font-size:12px;color:#6F6E6E;padding:0 5px;line-height:1.8;\"><p style=\"margin:0;\"><strong>免责声明：</strong>本文用于健康科普与医学知识教育，不能替代个体化诊断和治疗。</p><p style=\"margin:8px 0 0;\">责任编辑：如有真实信息再填写</p></section></section>"}];const cats=['全部',...new Set(COMPONENTS.map(x=>x.category))];let active='全部',query='';const chips=document.querySelector('#chips'),grid=document.querySelector('#grid'),search=document.querySelector('#search'),empty=document.querySelector('#empty');function renderChips(){chips.replaceChildren();cats.forEach(cat=>{const b=document.createElement('button');b.className='chip'+(cat===active?' active':'');b.textContent=cat;b.onclick=()=>{active=cat;renderChips();render()};chips.append(b)})}function render(){const q=query.trim().toLowerCase(),items=COMPONENTS.filter(x=>(active==='全部'||x.category===active)&&(!q||(x.id+' '+x.name).toLowerCase().includes(q)));grid.replaceChildren();empty.hidden=items.length>0;items.forEach(item=>{const card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='card-head';const copyWrap=document.createElement('div');copyWrap.innerHTML='<div class="card-id"></div><div class="card-name"></div>';copyWrap.querySelector('.card-id').textContent=item.id;copyWrap.querySelector('.card-name').textContent=item.name;const btn=document.createElement('button');btn.className='copy';btn.textContent='复制 HTML';btn.onclick=async()=>{try{await navigator.clipboard.writeText(item.html)}catch{const ta=document.createElement('textarea');ta.value=item.html;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove()}btn.textContent='已复制';btn.classList.add('done');setTimeout(()=>{btn.textContent='复制 HTML';btn.classList.remove('done')},1200)};head.append(copyWrap,btn);const shell=document.createElement('div');shell.className='preview-shell';const preview=document.createElement('div');preview.className='preview';preview.innerHTML=item.html;shell.append(preview);card.append(head,shell);grid.append(card)})}search.addEventListener('input',e=>{query=e.target.value;render()});renderChips();render();
