name: One-time import late session portraits 2026-08-21

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-session-portraits-20260821-2239.yml'

permissions:
  contents: write
  actions: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Validate staged semantic manifest
        shell: bash
        run: |
          set -euo pipefail
          cp '.github/import-staging/session-portraits-20260821-2239.json' /tmp/import-assets.json
          test "$(jq 'length' /tmp/import-assets.json)" -eq 39
          test "$(jq -r '.[].s' /tmp/import-assets.json | sort -u | wc -l)" -eq 39

      - name: Download and validate originals from Adobe bridge
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/session-import && mkdir -p /tmp/session-import
          while IFS= read -r row; do
            order=$(jq -r '.o' <<<"$row")
            url=$(jq -r '.u' <<<"$row")
            expectedSha=$(jq -r '.s' <<<"$row")
            target="/tmp/session-import/${order}.png"
            curl -L --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors "$url" -o "$target"
            mime=$(file -b --mime-type "$target")
            size=$(wc -c < "$target")
            sha=$(sha256sum "$target" | awk '{print $1}')
            echo "#$order -> $mime $size bytes $sha"
            [[ "$mime" == image/* ]]
            [[ "$size" -ge 1024 ]]
            [[ "$sha" == "$expectedSha" ]]
          done < <(jq -c '.[]' /tmp/import-assets.json)

      - name: Update gallery, prompts, and import report
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import sharp from 'sharp';

          const items = JSON.parse(fs.readFileSync('/tmp/import-assets.json','utf8'));
          const galleryPath = 'data/gallery.json';
          const promptIndexPath = 'data/prompt-index.json';
          const gallery = JSON.parse(fs.readFileSync(galleryPath,'utf8'));
          const promptIndex = JSON.parse(fs.readFileSync(promptIndexPath,'utf8'));
          if (gallery.schemaVersion !== 3 || !Array.isArray(gallery.assets)) throw new Error('gallery schemaVersion must be 3');
          if (promptIndex.schemaVersion !== 1 || !promptIndex.assets || Array.isArray(promptIndex.assets)) throw new Error('prompt-index schemaVersion must be 1');

          const hashFile = (p) => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const walk = (dir) => fs.existsSync(dir) ? fs.readdirSync(dir,{withFileTypes:true}).flatMap(e => { const p=path.join(dir,e.name); return e.isDirectory()?walk(p):[p]; }) : [];
          const existingBySha = new Map();
          for (const p of walk('images')) {
            if (!/\.(png|jpe?g|webp)$/i.test(p)) continue;
            existingBySha.set(hashFile(p), p.replaceAll('\\','/'));
          }
          const galleryByPath = new Map(gallery.assets.map(a => [a.path,a]));
          const existingIds = new Set(gallery.assets.map(a => a.id));
          const existingPaths = new Set(gallery.assets.map(a => a.path));
          const allowed = new Set(['multi-panel','black','red','pink','blue','white','purple','green','gold','other']);

          let downloadedCount=0, uniqueCount=0, existingCount=0, addedCount=0, promptCount=0;
          const seenBatch = new Set();
          const reportAssets=[];
          const identityAnchor = '参考同一位成年东方女性人物，严格保持稳定一致的人物身份：精致偏椭圆的脸型与骨相、协调的眉眼鼻唇比例、深色长发、清晰有互动感的眼神和优雅东方气质；不同主题只改变服装、配饰、动作、姿态、表情、场景、色调与构图，不改变人物身份。';
          const quality = '单人竖版高分辨率时装肖像，皮肤保留自然细节，发丝、刺绣、薄纱、珠宝和环境材质清晰，光影有电影级层次与自然景深，整体精致、高级、细节丰富。不要文字、不要水印、不要拼图、不要多人、不要畸形肢体或多余手指，不要近似重复其他作品的场景与造型。';
          const createdAt='2026-08-21T22:39:00+08:00';

          for (const item of items) {
            if (!allowed.has(item.c)) throw new Error(`invalid category ${item.c}`);
            const temp=`/tmp/session-import/${item.o}.png`;
            const sha=hashFile(temp);
            downloadedCount++;
            if (sha !== item.s) throw new Error(`sha mismatch after download: ${item.n}`);
            if (seenBatch.has(sha)) throw new Error(`duplicate within batch: ${item.n}`);
            seenBatch.add(sha); uniqueCount++;
            const meta=await sharp(temp,{failOn:'none'}).rotate().metadata();
            if (!(Number(meta.width)>0 && Number(meta.height)>0)) throw new Error(`sharp cannot parse ${item.n}`);

            const existingPath=existingBySha.get(sha);
            if (existingPath) {
              existingCount++;
              const old=galleryByPath.get(existingPath);
              reportAssets.push({order:item.o,sourceFileName:item.n,adobeAssetId:item.a,assetId:old?.id ?? sha.slice(0,12),finalPath:existingPath,sha256:sha,width:meta.width,height:meta.height,bytes:fs.statSync(temp).size,status:'existing'});
              continue;
            }

            const id=sha.slice(0,12);
            const title=item.n.replace(/\.png$/i,'').replaceAll('_','·');
            const finalPath=`images/oriental-fashion-beauty/session-2026-08-21-late/portrait-${String(item.o).padStart(3,'0')}-${sha.slice(0,8)}.png`;
            if (existingIds.has(id)) throw new Error(`asset id collision: ${id}`);
            if (existingPaths.has(finalPath)) throw new Error(`asset path collision: ${finalPath}`);
            fs.mkdirSync(path.dirname(finalPath),{recursive:true});
            fs.copyFileSync(temp,finalPath);
            const tags=['东方美人时装肖像集4','同一人物','竖版肖像',item.t];
            gallery.assets.push({id,path:finalPath,title,domain:'character',category:item.c,tags,createdAt});
            existingIds.add(id); existingPaths.add(finalPath); existingBySha.set(sha,finalPath); galleryByPath.set(finalPath,gallery.assets.at(-1));
            addedCount++;

            const promptPath=`prompts/assets/${id}.md`;
            fs.mkdirSync(path.dirname(promptPath),{recursive:true});
            const prompt=[`# ${title}`,'','> 提示词类型：reconstructed  ','> 关联人物：东方美人时装肖像集4  ','> 依据：本会话实际成图 + 生成上下文 + 逐图视觉重建','','## 生成提示词','',identityAnchor,'',`本张具体画面：${item.d}`,'',quality,''].join('\n');
            fs.writeFileSync(promptPath,prompt,'utf8');
            promptIndex.assets[id]={path:promptPath,kind:'reconstructed'};
            promptCount++;
            reportAssets.push({order:item.o,sourceFileName:item.n,adobeAssetId:item.a,assetId:id,finalPath,sha256:sha,width:meta.width,height:meta.height,bytes:fs.statSync(temp).size,status:'added'});
          }

          const counts={candidateCount:items.length,bridgedCount:items.length,downloadedCount,uniqueCount,existingCount,addedCount,promptCount};
          if (items.length!==39 || downloadedCount!==39 || uniqueCount!==39) throw new Error(`batch count mismatch ${JSON.stringify(counts)}`);
          if (addedCount+existingCount!==39) throw new Error(`added + existing mismatch ${JSON.stringify(counts)}`);
          if (promptCount!==addedCount) throw new Error(`prompt count mismatch ${JSON.stringify(counts)}`);

          fs.writeFileSync(galleryPath,JSON.stringify(gallery,null,2)+'\n','utf8');
          fs.writeFileSync(promptIndexPath,JSON.stringify(promptIndex,null,2)+'\n','utf8');
          fs.mkdirSync('data/imports',{recursive:true});
          const report={schemaVersion:1,batch:'session-portraits-20260821-2239',domain:'character',characterSlug:'oriental-fashion-beauty',transfer:'Adobe asset_openai_file_upload -> presignedAssetUrl -> GitHub Actions curl',createdAt,counts,assets:reportAssets};
          fs.writeFileSync('data/imports/session-portraits-20260821-2239.json',JSON.stringify(report,null,2)+'\n','utf8');
          console.log(JSON.stringify(counts));
          NODE

      - name: Build and validate gallery
        run: npm run build

      - name: Remove one-time resources
        run: |
          rm -f '.github/workflows/import-session-portraits-20260821-2239.yml'
          rm -f '.github/import-staging/session-portraits-20260821-2239.json'
          rmdir '.github/import-staging' 2>/dev/null || true

      - name: Commit import to main and dispatch Pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(gallery): import late-session portraits via Adobe bridge'
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
