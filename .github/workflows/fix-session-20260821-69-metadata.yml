name: Fix 69 session portrait metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-session-20260821-69-metadata.yml

permissions:
  contents: write
  actions: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Materialize visual-fix script
        run: |
          cat > /tmp/fix-script.b64 <<'B64'
          
          B64
          base64 -d /tmp/fix-script.b64 | gzip -d > /tmp/fix-session-20260821-69.mjs
          node --check /tmp/fix-session-20260821-69.mjs
      - name: Correct categories from visual inspection
        run: node /tmp/fix-session-20260821-69.mjs categories
      - name: Build after category correction
        run: npm run build
      - name: Commit category correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gallery.json
          git commit -m 'fix(gallery): correct 69 portrait color categories'
      - name: Rebuild 69 prompts from per-image visual inspection
        run: node /tmp/fix-session-20260821-69.mjs prompts
      - name: Build after prompt reconstruction
        run: npm run build
      - name: Commit prompt reconstruction and clean workflow
        run: |
          rm -f .github/workflows/fix-session-20260821-69-metadata.yml
          git add prompts/assets data/prompt-index.json .github/workflows/fix-session-20260821-69-metadata.yml
          git commit -m 'fix(prompts): rebuild 69 session prompts from visual inspection'
          git push origin HEAD:main
      - name: Explicitly dispatch Pages
        run: gh workflow run pages.yml --ref main
