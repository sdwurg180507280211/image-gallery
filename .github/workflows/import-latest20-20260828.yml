name: Import latest 20 portraits 20260828

on:
  push:
    branches:
      - main
    paths:
      - '.github/import-latest20-20260828.trigger'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: import-latest20-20260828
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Import prepared portrait manifest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import sharp from 'sharp';

          const manifestPath = '.github/import-latest20-20260828.manifest.json';
          const galleryPath = 'data/gallery.json';
          const promptIndexPath = 'data/prompt-index.json';
          const reportPath = 'data/imports/session-portraits-20260828-latest20.json';
          const expectedCount = 20;
          const characterId = 'oriental-fashion-beauty';
          const seriesSlug = 'session-2026-08-28-latest20';
          const seriesId = `${characterId}--${seriesSlug}`;

          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const gallery = JSON.parse(fs.readFileSync(galleryPath, 'utf8'));
          const promptIndex = JSON.parse(fs.readFileSync(promptIndexPath, 'utf8'));

          if (!Array.isArray(manifest.items) || manifest.items.length !== expectedCount) {
            throw new Error(`Manifest must contain exactly ${expectedCount} items; got ${manifest.items?.length}`);
          }
          if (gallery.schemaVersion !== 3 || !Array.isArray(gallery.assets)) {
            throw new Error('data/gallery.json must be schemaVersion 3 with assets[]');
          }
          if (promptIndex.schemaVersion !== 1 || typeof promptIndex.assets !== 'object' || Array.isArray(promptIndex.assets)) {
            throw new Error('data/prompt-index.json must be schemaVersion 1 with assets{}');
          }

          const allowedCategories = new Set(['multi-panel','black','red','pink','blue','white','purple','green','gold','other']);
          const existingIds = new Set(gallery.assets.map((asset) => asset.id));
          const existingPaths = new Set(gallery.assets.map((asset) => asset.path));
          const plannedIds = new Set();
          const plannedPaths = new Set();

          for (const item of manifest.items) {
            if (!allowedCategories.has(item.category)) throw new Error(`Invalid category for order ${item.order}: ${item.category}`);
            if (existingIds.has(item.assetId) || plannedIds.has(item.assetId)) throw new Error(`Asset ID collision: ${item.assetId}`);
            if (existingPaths.has(item.finalPath) || plannedPaths.has(item.finalPath)) throw new Error(`Asset path collision: ${item.finalPath}`);
            if (!String(item.url || '').startsWith('https://')) throw new Error(`Invalid Adobe URL for order ${item.order}`);
            plannedIds.add(item.assetId);
            plannedPaths.add(item.finalPath);
          }

          const identityBase = '参考同一位成年东方女性人物，严格保持稳定一致的人物身份：精致偏椭圆脸型与柔和骨相、协调稳定的眉眼鼻唇比例、深色长发与精致盘发特征、清晰有互动感的杏眼、细腻白皙肤质，以及优雅、成熟、带高级魅惑感的东方气质。只改变本张作品的服装、配饰、动作、姿态、表情、场景、色调和构图，不改变人物身份与年龄。';
          const qualityBase = '单人竖版高分辨率艺术时装肖像，脸部完整清晰，解剖自然，手部正常；皮肤保留细腻自然质感，发丝、珠宝、刺绣、薄纱、丝绒、金属等材质清晰，电影级光影与自然景深。不要文字、不要水印、不要拼图、不要多人、不要画中画、不要多余肢体或畸形手指。';
          const reportAssets = [];
          let downloadedCount = 0;
          let addedCount = 0;
          let promptCount = 0;

          for (const item of manifest.items) {
            fs.mkdirSync(path.dirname(item.finalPath), { recursive: true });
            execFileSync('curl', [
              '-L','--fail','--silent','--show-error',
              '--retry','3','--retry-delay','2','--retry-all-errors',
              item.url,'-o',item.finalPath
            ], { stdio: 'inherit' });

            const stat = fs.statSync(item.finalPath);
            if (stat.size < 1024) throw new Error(`Downloaded file too small: ${item.finalPath} (${stat.size} bytes)`);
            const mime = execFileSync('file', ['-b','--mime-type',item.finalPath], { encoding: 'utf8' }).trim();
            if (!mime.startsWith('image/')) throw new Error(`Downloaded file is not an image: ${item.finalPath} (${mime})`);
            const meta = await sharp(item.finalPath).metadata();
            if (!meta.width || !meta.height) throw new Error(`sharp could not read dimensions: ${item.finalPath}`);
            const sha256 = crypto.createHash('sha256').update(fs.readFileSync(item.finalPath)).digest('hex');
            downloadedCount += 1;

            gallery.assets.push({
              id: item.assetId,
              path: item.finalPath,
              title: item.title,
              domain: 'character',
              category: item.category,
              tags: item.tags,
              createdAt: item.createdAt,
              characterId,
              seriesSlug,
              seriesId
            });
            addedCount += 1;

            const fullPrompt = `${identityBase}\n\n本张具体画面：${item.specific}\n\n${qualityBase}`;
            const promptPath = `prompts/assets/${item.assetId}.md`;
            fs.mkdirSync(path.dirname(promptPath), { recursive: true });
            const promptMarkdown = `# ${item.title}\n\n> 提示词类型：reconstructed  \n> 关联人物：东方美人时装肖像集4  \n> 依据：本会话实际成图 + 生成上下文 + 逐图视觉重建\n\n## 生成提示词\n\n${fullPrompt}\n`;
            fs.writeFileSync(promptPath, promptMarkdown, 'utf8');
            promptIndex.assets[item.assetId] = { path: promptPath, kind: 'reconstructed' };
            promptCount += 1;

            reportAssets.push({
              order: item.order,
              sourceFileName: item.originalFileName,
              adobeAssetId: item.adobeAssetId,
              assetId: item.assetId,
              finalPath: item.finalPath,
              sha256,
              width: meta.width,
              height: meta.height,
              bytes: stat.size,
              status: 'added'
            });
          }

          if (downloadedCount !== expectedCount || addedCount !== expectedCount || promptCount !== expectedCount) {
            throw new Error(`Batch count mismatch: downloaded=${downloadedCount}, added=${addedCount}, prompts=${promptCount}`);
          }

          fs.writeFileSync(galleryPath, `${JSON.stringify(gallery, null, 2)}\n`, 'utf8');
          fs.writeFileSync(promptIndexPath, `${JSON.stringify(promptIndex, null, 2)}\n`, 'utf8');
          fs.mkdirSync(path.dirname(reportPath), { recursive: true });
          fs.writeFileSync(reportPath, `${JSON.stringify({
            schemaVersion: 1,
            batch: manifest.batch,
            domain: 'character',
            characterSlug: characterId,
            seriesSlug,
            transfer: 'Adobe asset_openai_file_upload -> presignedAssetUrl -> GitHub Actions curl',
            createdAt: '2026-08-28T15:35:00+08:00',
            counts: {
              candidateCount: expectedCount,
              bridgedCount: expectedCount,
              downloadedCount,
              addedCount,
              promptCount
            },
            assets: reportAssets
          }, null, 2)}\n`, 'utf8');

          console.log(JSON.stringify({ downloadedCount, addedCount, promptCount }, null, 2));
          NODE

      - name: Build and validate gallery
        run: npm run build

      - name: Commit imported assets and remove one-time files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/import-latest20-20260828.yml
          git rm --ignore-unmatch .github/import-latest20-20260828.trigger
          git rm --ignore-unmatch .github/import-latest20-20260828.manifest.json
          git add -A
          git commit -m 'feat(gallery): import latest 20 session portraits via Adobe bridge'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Trigger Pages deployment
        run: gh workflow run pages.yml --ref main
