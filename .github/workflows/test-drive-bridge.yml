name: Test Drive Bridge
on:
  push:
    paths:
      - '.github/workflows/test-drive-bridge.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test anonymous Drive download and self-report
        shell: bash
        run: |
          set +e
          url='https://drive.google.com/uc?export=download&id=1xgYXPrPQGDu3Rs9mOd9IGnqYIl82uJ4E'
          curl -L --silent --show-error --retry 2 "$url" -o /tmp/test.bin
          rc=$?
          size=0
          mime='missing'
          if [ -f /tmp/test.bin ]; then
            size=$(stat -c%s /tmp/test.bin)
            mime=$(file -b --mime-type /tmp/test.bin)
          fi
          mkdir -p .github/bridge-test
          printf 'curl_rc=%s\nsize=%s\nmime=%s\n' "$rc" "$size" "$mime" > .github/bridge-test/result.txt
          rm -f .github/workflows/test-drive-bridge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/bridge-test/result.txt .github/workflows/test-drive-bridge.yml
          git commit -m 'chore: record Drive bridge test and self-clean'
          git push
