name: Import current conversation images via Adobe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-generated-20260731-1645.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-current-conversation-images
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WORKFLOW_PATH: .github/workflows/import-generated-20260731-1645.yml
      IMPORT_DIR: .github/imports/generated-20260731
      AUDIT_PATH: data/imports/current-conversation-20260731.json

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Assemble Adobe bridge manifest
        shell: bash
        run: |
          set -euo pipefail
          cat "$IMPORT_DIR"/part-*.tsv > /tmp/import.tsv
          test "$(wc -l < /tmp/import.tsv)" -eq 137

      - name: Download, validate, deduplicate, and create sidecars
        shell: bash
        run: |
          set -euo pipefail
          node "$IMPORT_DIR/import.mjs"

      - name: Generate and verify gallery index
        shell: bash
        run: |
          set -euo pipefail
          npm run generate
          node "$IMPORT_DIR/verify.mjs"

      - name: Self-clean, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$WORKFLOW_PATH"
          rm -rf "$IMPORT_DIR"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(gallery): import generated images from current conversation"
          git pull --rebase origin main
          git push origin HEAD:main

          COMMIT_SHA="$(git rev-parse HEAD)"
          echo "## Adobe 图片导入完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`$COMMIT_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          node --input-type=module <<'NODE'
          import {appendFileSync,readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync(process.env.AUDIT_PATH,'utf8'));
          const lines=[
            `- 发现生成图片：${r.discoveredGeneratedImages}`,
            `- 有效原始图片：${r.effectiveUniqueOriginalImages}`,
            `- 成功新增：${r.successAdded}`,
            `- 仓库已存在：${r.repositoryExistingSkipped}`,
            `- 重复跳过：${r.duplicateSkipped}`,
            `- 失败：${r.failed}`,
            `- gallery.json：${r.galleryCountBefore} → ${r.galleryCountAfter}`,
            '- 临时工作流：已删除',
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          console.log(lines.join('\n'));
          NODE
