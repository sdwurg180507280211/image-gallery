name: Series Browser Build Test

on:
  push:
    branches: [feat/series-browser]
    paths-ignore:
      - data/.series-browser-build-ok

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Record successful build
        run: |
          printf '{"ok":true,"commit":"%s"}\n' "$GITHUB_SHA" > data/.series-browser-build-ok
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/.series-browser-build-ok
          git commit -m 'test(ci): record series browser build success'
          git push
