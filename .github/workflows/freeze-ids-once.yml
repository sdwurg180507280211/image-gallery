name: Freeze existing image IDs once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/freeze-ids-once.yml

permissions:
  contents: write

jobs:
  freeze-ids:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write stable IDs to sidecar metadata
        run: node scripts/freeze-metadata-ids.mjs --write

      - name: Commit frozen IDs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images data/id-freeze-manifest.json
          if git diff --cached --quiet; then
            echo "No metadata changes required."
            exit 0
          fi
          git commit -m "chore: freeze existing image IDs"
          git push
