      - name: Download and validate originals from Adobe bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/portraitset4-originals
          while IFS= read -r row; do
            order=$(jq -r '.order' <<<"$row")
            url=$(jq -r '.url' <<<"$row")
            expected_media=$(jq -r '.mediaType' <<<"$row")
            expected_sha=$(jq -r '.expectedSha256' <<<"$row")
            temp="/tmp/portraitset4-originals/$(printf '%03d' "$order").png"

            curl -L --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors "$url" -o "$temp"

            mime=$(file -b --mime-type "$temp")
            size=$(wc -c < "$temp")
            actual_sha=$(sha256sum "$temp" | awk '{print $1}')
            echo "item=$order mime=$mime bytes=$size sha256=$actual_sha"

            [[ "$expected_media" == image/* ]]
            [[ "$mime" == image/* ]]
            [[ "$size" -ge 1024 ]]
            [[ "$actual_sha" == "$expected_sha" ]]
          done < <(jq -c '.[]' /tmp/import-assets.json)

      - name: Update gallery, prompt archive, and import record
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import sharp from 'sharp';

          const items = JSON.parse(fs.readFileSync('/tmp/import-assets.json', 'utf8'));
          const galleryPath = 'data/gallery.json';
          const promptIndexPath = 'data/prompt-index.json';
          const importMapPath = 'data/imports/portraitset4-session-20260821-2216-adobe-bridge.json';
          const gallery = JSON.parse(fs.readFileSync(galleryPath, 'utf8'));
          const promptIndex = JSON.parse(fs.readFileSync(promptIndexPath, 'utf8'));

          if (gallery.schemaVersion !== 3 || !Array.isArray(gallery.assets)) {
            throw new Error('gallery schemaVersion must be 3');
          }
          if (promptIndex.schemaVersion !== 1 || !promptIndex.assets || Array.isArray(promptIndex.assets)) {
            throw new Error('prompt-index schemaVersion must be 1');
          }

          const allowedCategories = new Set(['multi-panel','black','red','pink','blue','white','purple','green','gold','other']);
          const existingById = new Map(gallery.assets.map(a => [a.id, a]));
          const existingByPath = new Map(gallery.assets.map(a => [a.path, a]));
          const historicalSha = new Map();

          if (fs.existsSync('data/imports')) {
            for (const file of fs.readdirSync('data/imports')) {
              if (!file.endsWith('.json')) continue;
              try {
                const doc = JSON.parse(fs.readFileSync(path.join('data/imports', file), 'utf8'));
                for (const a of (doc.assets || [])) {
                  if (a.sha256) historicalSha.set(a.sha256, a);
                }
              } catch {}
            }
          }

          const batchSha = new Set();
          const importAssets = [];
          let downloadedCount = 0;
          let existingCount = 0;
          let addedCount = 0;
          let promptCount = 0;

          for (const item of items) {
            if (!allowedCategories.has(item.category)) throw new Error(`invalid category ${item.category} for ${item.originalFileName}`);
            if (item.domain !== 'character') throw new Error(`invalid domain for ${item.originalFileName}`);
            if (item.promptKind !== 'reconstructed') throw new Error(`unexpected prompt kind for ${item.originalFileName}`);
            if (!item.adobeAssetId || !item.url || !String(item.mediaType).startsWith('image/')) throw new Error(`incomplete Adobe bridge data for ${item.originalFileName}`);

            const temp = `/tmp/portraitset4-originals/${String(item.order).padStart(3,'0')}.png`;
            if (!fs.existsSync(temp)) throw new Error(`missing downloaded file ${temp}`);
            const bytes = fs.statSync(temp).size;
            const actualSha = crypto.createHash('sha256').update(fs.readFileSync(temp)).digest('hex');
            if (actualSha !== item.expectedSha256) throw new Error(`SHA mismatch after download for ${item.originalFileName}`);
            downloadedCount++;

            if (batchSha.has(actualSha)) throw new Error(`duplicate SHA inside batch: ${actualSha}`);
            batchSha.add(actualSha);

            const meta = await sharp(temp, { failOn: 'none' }).rotate().metadata();
            if (!(Number(meta.width) > 0 && Number(meta.height) > 0)) throw new Error(`sharp cannot parse ${item.originalFileName}`);

            const priorFromSha = historicalSha.get(actualSha);
            const priorFromId = existingById.get(item.id);
            const prior = priorFromSha ? existingById.get(priorFromSha.assetId || priorFromSha.id) || gallery.assets.find(a => a.path === priorFromSha.finalPath || a.path === priorFromSha.path) : priorFromId;

            let status = 'added';
            let finalPath = item.path;
            let finalId = item.id;

            if (prior) {
              status = 'existing';
              existingCount++;
              finalPath = prior.path;
              finalId = prior.id;
            } else {
              const pathCollision = existingByPath.get(item.path);
              if (pathCollision) throw new Error(`path collision for ${item.path}`);
              fs.mkdirSync(path.dirname(item.path), { recursive: true });
              fs.copyFileSync(temp, item.path);

              const record = {
                id: item.id,
                path: item.path,
                title: item.title,
                domain: 'character',
                category: item.category,
                tags: item.tags,
                createdAt: item.createdAt
              };
              gallery.assets.push(record);
              existingById.set(item.id, record);
              existingByPath.set(item.path, record);
              addedCount++;

              const promptPath = `prompts/assets/${item.id}.md`;
              fs.mkdirSync(path.dirname(promptPath), { recursive: true });
              const promptMarkdown = [
                `# ${item.title}`,
                '',
                '> 提示词类型：reconstructed  ',
                '> 关联人物：东方美人时装肖像集4  ',
                `> 原始文件：${item.originalFileName}  `,
                '> 依据：本会话生成图视觉内容 + 当前生成上下文重建',
                '',
                '## 生成提示词',
                '',
                item.prompt,
                ''
              ].join('\n');
              fs.writeFileSync(promptPath, promptMarkdown, 'utf8');
              promptIndex.assets[item.id] = { path: promptPath, kind: 'reconstructed' };
              promptCount++;
            }

            importAssets.push({
              order: item.order,
              originalFileName: item.originalFileName,
              adobeAssetId: item.adobeAssetId,
              mediaType: item.mediaType,
              finalPath,
              assetId: finalId,
              sha256: actualSha,
              width: meta.width,
              height: meta.height,
              bytes,
              status
            });
          }

          const candidateCount = items.length;
          const bridgedCount = items.filter(i => i.adobeAssetId && i.url && String(i.mediaType).startsWith('image/')).length;
          const uniqueCount = batchSha.size;

          if (candidateCount !== 39) throw new Error(`candidateCount expected 39, got ${candidateCount}`);
          if (bridgedCount !== candidateCount) throw new Error(`bridgedCount mismatch ${bridgedCount}/${candidateCount}`);
          if (downloadedCount !== candidateCount) throw new Error(`downloadedCount mismatch ${downloadedCount}/${candidateCount}`);
          if (uniqueCount !== candidateCount) throw new Error(`uniqueCount mismatch ${uniqueCount}/${candidateCount}`);
          if (addedCount + existingCount !== uniqueCount) throw new Error(`added+existing mismatch`);
          if (promptCount !== addedCount) throw new Error(`promptCount mismatch ${promptCount}/${addedCount}`);

          fs.writeFileSync(galleryPath, `${JSON.stringify(gallery, null, 2)}\n`, 'utf8');
          fs.writeFileSync(promptIndexPath, `${JSON.stringify(promptIndex, null, 2)}\n`, 'utf8');

          const importDoc = {
            schemaVersion: 1,
            batch: 'portraitset4-session-20260821-2216',
            domain: 'character',
            characterSlug: 'oriental-fashion-beauty',
            transfer: 'Adobe asset_openai_file_upload -> presignedAssetUrl -> GitHub Actions curl',
            createdAt: '2026-08-21T22:16:00+08:00',
            counts: {
              candidateCount,
              bridgedCount,
              downloadedCount,
              uniqueCount,
              existingCount,
              addedCount,
              promptCount
            },
            assets: importAssets
          };
          fs.mkdirSync(path.dirname(importMapPath), { recursive: true });
          fs.writeFileSync(importMapPath, `${JSON.stringify(importDoc, null, 2)}\n`, 'utf8');
          fs.writeFileSync('/tmp/import-counts.json', `${JSON.stringify(importDoc.counts)}\n`, 'utf8');
          console.log(JSON.stringify(importDoc.counts));
          NODE

      - name: Build and validate gallery
        run: npm run build

      - name: Remove one-time workflow
        run: rm -f '.github/workflows/import-portraitset4-session-20260821-2216.yml'

      - name: Commit import to main and dispatch Pages
        shell: bash
        run: |
          set -euo pipefail
          added=$(jq -r '.addedCount' /tmp/import-counts.json)
          existing=$(jq -r '.existingCount' /tmp/import-counts.json)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "feat(gallery): import ${added} portraitset4 session images via Adobe bridge"
          git push origin HEAD:main
          echo "added=$added existing=$existing"
          gh workflow run pages.yml --ref main
