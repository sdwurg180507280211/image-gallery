name: Delete manual-review images once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-manual-review-images-once.yml

permissions:
  contents: write

concurrency:
  group: delete-manual-review-images
  cancel-in-progress: false

jobs:
  delete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Delete exactly 13 manual-review images and sidecars
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const imageExtensions = ['.png', '.jpg', '.jpeg', '.webp', '.gif', '.avif'];
          const deleted = [];

          function walk(directory) {
            if (!fs.existsSync(directory)) return [];
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const fullPath = path.join(directory, entry.name);
              return entry.isDirectory() ? walk(fullPath) : [fullPath];
            });
          }

          for (const metadataPath of walk('images').filter((file) => file.endsWith('.json'))) {
            const metadata = JSON.parse(fs.readFileSync(metadataPath, 'utf8'));
            if (metadata.needsManualReview !== true) continue;

            const base = metadataPath.slice(0, -'.json'.length);
            const imagePath = imageExtensions.map((ext) => base + ext).find((candidate) => fs.existsSync(candidate));
            if (!imagePath) throw new Error(`找不到待删除 JSON 对应的原图：${metadataPath}`);

            deleted.push({
              id: metadata.id || '',
              title: metadata.title || path.basename(base),
              imagePath: imagePath.split(path.sep).join('/'),
              metadataPath: metadataPath.split(path.sep).join('/'),
              manualReviewReason: metadata.manualReviewReason || '',
            });
          }

          if (deleted.length !== 13) {
            throw new Error(`安全检查失败：预期删除 13 张，实际找到 ${deleted.length} 张。未执行删除。`);
          }

          for (const item of deleted) {
            fs.rmSync(item.imagePath, { force: false });
            fs.rmSync(item.metadataPath, { force: false });
          }

          fs.mkdirSync('data/imports', { recursive: true });
          fs.writeFileSync('data/imports/deleted-manual-review-13.json', JSON.stringify({
            schemaVersion: 2,
            deletedAt: new Date().toISOString(),
            count: deleted.length,
            reason: '用户明确表示这 13 张边界图片不再需要。',
            items: deleted,
          }, null, 2) + '\n');

          console.log(`已删除 ${deleted.length} 张原图及 ${deleted.length} 个同名 JSON。`);
          NODE

      - name: Remove obsolete review page and failed one-time workflow
        run: |
          rm -f review.html .github/workflows/add-review-filter-once.yml
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/build-site.mjs';
          let source = fs.readFileSync(file, 'utf8');
          source = source.replace("  await copyIfExists(path.join(root, 'review.html'), path.join(dist, 'review.html'));\n", '');
          fs.writeFileSync(file, source);
          NODE

      - name: Install dependencies and rebuild gallery
        run: |
          npm install --no-audit --no-fund
          npm run build
          node <<'NODE'
          const fs = require('node:fs');
          const gallery = JSON.parse(fs.readFileSync('data/gallery.json', 'utf8'));
          const report = JSON.parse(fs.readFileSync('data/validation-report.json', 'utf8'));
          const reviewCount = (gallery.images || []).filter((item) => item.needsManualReview).length;
          if (gallery.count !== 165 || gallery.images.length !== 165) {
            throw new Error(`重建数量错误：预期 165，实际 ${gallery.count}/${gallery.images.length}`);
          }
          if (reviewCount !== 0) throw new Error(`仍有 ${reviewCount} 张待复核图片。`);
          if (report.summary.errors !== 0 || report.summary.warnings !== 0) {
            throw new Error(`校验未通过：错误 ${report.summary.errors}，警告 ${report.summary.warnings}`);
          }
          console.log('校验通过：165 张，待复核 0，错误 0，警告 0。');
          NODE

      - name: Commit deletion and self-clean
        run: |
          set -euo pipefail
          rm -f .github/workflows/delete-manual-review-images-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(gallery): remove 13 manual-review images"
          git push origin HEAD:main
