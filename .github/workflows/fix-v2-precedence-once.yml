name: Fix explicit V2 metadata precedence once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-v2-precedence-once.yml

permissions:
  contents: write

concurrency:
  group: fix-v2-metadata-precedence
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prefer explicit V2 fields over legacy folders
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/generate-gallery.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const startMarker = "  if (!theme.length && legacyThemeFolders.has(folder))";
          const endMarker = "\n\n  for (const tag of tags)";
          const start = source.indexOf(startMarker);
          const end = source.indexOf(endMarker, start);
          if (start < 0 || end < 0) throw new Error('Legacy inference block markers were not found.');
          const newBlock = [
            "  const hasExplicitComposition = Object.prototype.hasOwnProperty.call(metadata, 'composition');",
            "  const hasExplicitAssetType = Object.prototype.hasOwnProperty.call(metadata, 'assetType') && Boolean(String(metadata.assetType || '').trim());",
            "",
            "  if (!theme.length && legacyThemeFolders.has(folder)) addUnique(theme, legacyThemeFolders.get(folder));",
            "  if (!scene.length && legacySceneFolders.has(folder)) addUnique(scene, legacySceneFolders.get(folder));",
            "  if (!palette.length && legacyPaletteFolders.has(folder)) addUnique(palette, legacyPaletteFolders.get(folder));",
            "  if (!theme.length && folder === 'multi-theme') addUnique(theme, 'fantasy');",
            "",
            "  if (!hasExplicitComposition) {",
            "    if (folder === 'multi-panel') addUnique(composition, 'multi-panel');",
            "    else if (folder === 'character-sheet') addUnique(composition, 'multi-panel', 'character-turnaround');",
            "    else if (folder === 'multi-theme') addUnique(composition, 'multi-panel', 'mixed-shot');",
            "  }",
            "",
            "  if (!hasExplicitAssetType) {",
            "    if (folder === 'multi-panel' || folder === 'multi-theme') assetType = 'collage';",
            "    else if (folder === 'character-sheet') assetType = 'character-sheet';",
            "  }",
          ].join('\n');
          source = source.slice(0, start) + newBlock + source.slice(end);
          fs.writeFileSync(file, source);
          NODE

      - name: Install image tooling
        run: npm install --no-audit --no-fund

      - name: Rebuild and validate gallery
        run: npm run build

      - name: Commit fix and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-v2-precedence-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-gallery.mjs data/gallery.json data/validation-report.json .github/workflows/fix-v2-precedence-once.yml
          git commit -m "fix(metadata): prefer explicit V2 fields over legacy folders"
          git push origin HEAD:main
