name: Build and deploy gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore generated thumbnail cache
        uses: actions/cache@v4
        with:
          path: .cache/thumbnails
          key: gallery-thumbnails-v1-${{ hashFiles('images/**/*.png', 'images/**/*.jpg', 'images/**/*.jpeg', 'images/**/*.webp', 'images/**/*.gif', 'images/**/*.avif') }}
          restore-keys: |
            gallery-thumbnails-v1-

      - name: Install image tooling
        run: npm install --no-audit --no-fund

      - name: Build optimized gallery
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
