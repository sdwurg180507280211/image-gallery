name: Add pending review filter once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-review-filter-once.yml

permissions:
  contents: write

concurrency:
  group: add-pending-review-filter
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add review fields and UI filter
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(file, before, after) {
            let source = fs.readFileSync(file, 'utf8');
            if (!source.includes(before)) throw new Error(`${file}: expected block not found`);
            source = source.replace(before, after);
            fs.writeFileSync(file, source);
          }

          replaceOnce('scripts/generate-gallery.mjs',
`    sourceChat: metadata.sourceChat || undefined,
  };`,
`    sourceChat: metadata.sourceChat || undefined,
    sourceBatch: metadata.sourceBatch || undefined,
    needsManualReview: Boolean(metadata.needsManualReview),
    manualReviewReason: metadata.manualReviewReason || undefined,
    auditBasis: metadata.auditBasis || undefined,
  };`);

          replaceOnce('assets/app.js',
`  favoritesOnly: false,
  activeIndex: -1,`,
`  favoritesOnly: false,
  reviewOnly: false,
  activeIndex: -1,`);

          replaceOnce('assets/app.js',
`  favoritesOnly: document.querySelector('#favoritesOnly'),
  clearFilters: document.querySelector('#clearFilters'),`,
`  favoritesOnly: document.querySelector('#favoritesOnly'),
  reviewOnly: document.querySelector('#reviewOnly'),
  clearFilters: document.querySelector('#clearFilters'),`);

          replaceOnce('assets/app.js',
`    height: Number(item.height) || 0,
  };`,
`    height: Number(item.height) || 0,
    needsManualReview: Boolean(item.needsManualReview),
    manualReviewReason: item.manualReviewReason || '',
    auditBasis: item.auditBasis || '',
  };`);

          replaceOnce('assets/app.js',
`      const favoriteMatches = !state.favoritesOnly || state.favorites.has(item.id);
      const facetsMatch = filterDimensions.every((dimension) => matchesFacet(item, dimension));`,
`      const favoriteMatches = !state.favoritesOnly || state.favorites.has(item.id);
      const reviewMatches = !state.reviewOnly || item.needsManualReview;
      const facetsMatch = filterDimensions.every((dimension) => matchesFacet(item, dimension));`);

          replaceOnce('assets/app.js',
`      return characterMatches && favoriteMatches && facetsMatch && (!normalizedQuery || searchable.includes(normalizedQuery));`,
`      return characterMatches && favoriteMatches && reviewMatches && facetsMatch && (!normalizedQuery || searchable.includes(normalizedQuery));`);

          replaceOnce('assets/app.js',
`    displayTags(item).slice(0, 4).forEach((tag) => {`,
`    const visibleTags = item.needsManualReview ? ['⚠ 待复核', ...displayTags(item)] : displayTags(item);
    visibleTags.slice(0, 4).forEach((tag) => {`);

          replaceOnce('assets/app.js',
`  const hasFilters = state.activeCharacter !== ALL || hasFacetFilters || state.query || state.favoritesOnly;`,
`  const hasFilters = state.activeCharacter !== ALL || hasFacetFilters || state.query || state.favoritesOnly || state.reviewOnly;`);

          replaceOnce('assets/app.js',
`  elements.lightboxDescription.textContent = item.description || displayTags(item).map((tag) => \`#\${tag}\`).join(' ');`,
`  const reviewNote = item.needsManualReview ? \`待复核原因：\${item.manualReviewReason || '分类边界需要人工确认'}\` : '';
  elements.lightboxDescription.textContent = [item.description || displayTags(item).map((tag) => \`#\${tag}\`).join(' '), reviewNote].filter(Boolean).join('\\n\\n');`);

          replaceOnce('assets/app.js',
`  state.favoritesOnly = false;
  filterDimensions.forEach((dimension) => { state.filters[dimension] = ALL; });`,
`  state.favoritesOnly = false;
  state.reviewOnly = false;
  filterDimensions.forEach((dimension) => { state.filters[dimension] = ALL; });`);

          replaceOnce('assets/app.js',
`  elements.favoritesOnly.setAttribute('aria-pressed', 'false');
  renderCharacters();`,
`  elements.favoritesOnly.setAttribute('aria-pressed', 'false');
  elements.reviewOnly.setAttribute('aria-pressed', 'false');
  renderCharacters();`);

          replaceOnce('assets/app.js',
`elements.favoritesOnly.addEventListener('click', () => {
  state.favoritesOnly = !state.favoritesOnly;
  elements.favoritesOnly.setAttribute('aria-pressed', String(state.favoritesOnly));
  applyFilters();
});
elements.clearFilters.addEventListener('click', clearFilters);`,
`elements.favoritesOnly.addEventListener('click', () => {
  state.favoritesOnly = !state.favoritesOnly;
  elements.favoritesOnly.setAttribute('aria-pressed', String(state.favoritesOnly));
  applyFilters();
});
elements.reviewOnly.addEventListener('click', () => {
  state.reviewOnly = !state.reviewOnly;
  elements.reviewOnly.setAttribute('aria-pressed', String(state.reviewOnly));
  applyFilters();
});
elements.clearFilters.addEventListener('click', clearFilters);`);

          replaceOnce('index.html',
`          <button class="text-button" id="favoritesOnly" type="button" aria-pressed="false">♡ 只看收藏</button>`,
`          <button class="text-button" id="reviewOnly" type="button" aria-pressed="false">⚠ 只看待复核</button>
          <button class="text-button" id="favoritesOnly" type="button" aria-pressed="false">♡ 只看收藏</button>`);
          NODE

      - name: Install dependencies and build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit and self-clean
        run: |
          set -euo pipefail
          rm -f .github/workflows/add-review-filter-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-gallery.mjs assets/app.js index.html data/gallery.json data/validation-report.json .github/workflows/add-review-filter-once.yml
          git commit -m "feat(gallery): add pending review filter"
          git push origin HEAD:main
