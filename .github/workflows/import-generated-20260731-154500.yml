name: Import current conversation generated images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-generated-20260731-154500.yml

permissions:
  contents: write

concurrency:
  group: import-current-conversation-images
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download, validate and write image metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');

          const manifestPath = '.github/imports/import-generated-20260731-154500.txt';
          const lines = fs.readFileSync(manifestPath, 'utf8').trim().split('\n').filter(Boolean);
          const records = lines.map((line) => {
            const [index, url, imagePath, title, theme, composition, createdAt, featured] = line.split('|');
            return { index: Number(index), url, path: imagePath, title, theme, composition, createdAt, featured: featured === 'true' };
          });

          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          function sha256(filePath) {
            return crypto.createHash('sha256').update(fs.readFileSync(filePath)).digest('hex');
          }

          function getImageInfo(filePath) {
            const b = fs.readFileSync(filePath);
            if (b.length < 24) throw new Error(`Image too small to parse: ${filePath}`);
            if (b.subarray(0, 8).equals(Buffer.from([137,80,78,71,13,10,26,10]))) {
              return { mime: 'image/png', width: b.readUInt32BE(16), height: b.readUInt32BE(20) };
            }
            throw new Error(`Unsupported or corrupt image: ${filePath}`);
          }

          const existingHashes = new Map();
          for (const file of walk('images')) {
            if (/\.(png|jpe?g|webp)$/i.test(file)) existingHashes.set(sha256(file), file);
          }

          const importedPaths = [];
          let imported = 0;
          let duplicate = 0;

          for (const rec of records) {
            const target = rec.path;
            const temp = `${target}.download-${process.pid}`;
            fs.mkdirSync(path.dirname(target), { recursive: true });
            execFileSync('curl', [
              '-L', '--fail', '--silent', '--show-error',
              '--retry', '3', '--retry-delay', '2', '--retry-all-errors',
              rec.url, '-o', temp
            ], { stdio: 'inherit' });

            const stat = fs.statSync(temp);
            if (stat.size < 10000) throw new Error(`Downloaded file is too small: ${target} (${stat.size} bytes)`);
            const info = getImageInfo(temp);
            if (!info.mime.startsWith('image/')) throw new Error(`Invalid MIME: ${target} (${info.mime})`);
            if (path.extname(target).toLowerCase() !== '.png' || info.mime !== 'image/png') {
              throw new Error(`Extension/MIME mismatch: ${target} (${info.mime})`);
            }
            if (info.width < 1 || info.height < 1) throw new Error(`Invalid dimensions: ${target}`);

            const hash = sha256(temp);
            if (existingHashes.has(hash)) {
              duplicate++;
              console.log(`SKIP_DUPLICATE #${rec.index} -> ${existingHashes.get(hash)}`);
              fs.unlinkSync(temp);
              continue;
            }
            if (fs.existsSync(target)) {
              const existingHash = sha256(target);
              if (existingHash === hash) {
                duplicate++;
                console.log(`SKIP_EXISTING #${rec.index} -> ${target}`);
                fs.unlinkSync(temp);
                existingHashes.set(hash, target);
                continue;
              }
              throw new Error(`Target collision with different content: ${target}`);
            }

            fs.renameSync(temp, target);
            const tags = [
              '红裳仙姬', '成年东方女性', '蓝灰眼', '黑色高盘发', '红金古装', '金色发饰',
              '人物特写', '半身', '全身构图', '回眸', '静坐', '伸手互动',
              '直视镜头', '互动视线', '妩媚', '魅惑', rec.theme, rec.composition
            ];
            const metadata = {
              title: rec.title,
              description: `红裳仙姬「${rec.title}」原始生成作品，画面呈现成年东方女性、蓝灰眼、黑色高盘发与红金古装，以${rec.theme}为主题，采用${rec.composition}构图，包含人物特写、半身或场景化姿态及互动凝视。`,
              category: '红裳仙姬',
              tags: [...new Set(tags)],
              createdAt: rec.createdAt,
              featured: rec.featured,
              width: info.width,
              height: info.height,
              sourceHash: hash,
              sourceType: 'ChatGPT Images original',
              conversationImageIndex: rec.index
            };
            fs.writeFileSync(target.replace(/\.[^.]+$/, '.json'), JSON.stringify(metadata, null, 2) + '\n');
            existingHashes.set(hash, target);
            imported++;
            importedPaths.push(target);
            console.log(`IMPORTED #${rec.index} ${target} ${info.width}x${info.height} ${hash}`);
          }

          console.log(JSON.stringify({ discovered: records.length, imported, duplicate, failed: 0, importedPaths }, null, 2));
          NODE

      - name: Generate gallery index
        run: npm run generate

      - name: Commit imported images and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-generated-20260731-154500.yml
          rm -f .github/imports/import-generated-20260731-154500.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/red-robed-immortal data/gallery.json .github/workflows/import-generated-20260731-154500.yml .github/imports/import-generated-20260731-154500.txt
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git commit -m "feat(gallery): import generated images from current conversation"
          git push origin HEAD:main
