name: Import current conversation generated images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-generated-20260731-154500.yml

permissions:
  contents: write

concurrency:
  group: import-current-conversation-images
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download, validate and write image metadata
        shell: bash
        env:
          RECORDS_B64: "  á  Iiwi55m96Imy5oqr6IKpIiwi5pyI5aScIiwi5Y2K6LqrIiwi6Zuq5aScIiwi5LqU6IGU55S7Il0sImNyZWF0ZWRBdCI6IjIwMjYtMDctMzFUMDc6MzU6MjFaIiwiZmVhdHVyZWQiOnRydWUsIndpZHRoIjoxNjcyLCJoZWlnaHQiOjk0MX1d"
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');

          const records = JSON.parse(Buffer.from(process.env.RECORDS_B64, 'base64').toString('utf8'));
          const existingHashes = new Map();

          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          function sha256(filePath) {
            return crypto.createHash('sha256').update(fs.readFileSync(filePath)).digest('hex');
          }

          function getImageInfo(filePath) {
            const b = fs.readFileSync(filePath);
            if (b.length < 24) throw new Error(`Image too small to parse: ${filePath}`);
            const png = b.subarray(0, 8).equals(Buffer.from([137,80,78,71,13,10,26,10]));
            if (png) {
              return { mime: 'image/png', width: b.readUInt32BE(16), height: b.readUInt32BE(20) };
            }
            if (b[0] === 0xff && b[1] === 0xd8) {
              let offset = 2;
              while (offset + 9 < b.length) {
                if (b[offset] !== 0xff) { offset++; continue; }
                const marker = b[offset + 1];
                const len = b.readUInt16BE(offset + 2);
                if ([0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9,0xca,0xcb,0xcd,0xce,0xcf].includes(marker)) {
                  return { mime: 'image/jpeg', height: b.readUInt16BE(offset + 5), width: b.readUInt16BE(offset + 7) };
                }
                if (len < 2) break;
                offset += 2 + len;
              }
            }
            throw new Error(`Unsupported or corrupt image: ${filePath}`);
          }

          for (const file of walk('images')) {
            if (!/\.(png|jpe?g|webp)$/i.test(file)) continue;
            existingHashes.set(sha256(file), file);
          }

          let imported = 0;
          let duplicate = 0;
          const importedPaths = [];

          for (const rec of records) {
            const target = rec.path;
            const temp = `${target}.download-${process.pid}`;
            fs.mkdirSync(path.dirname(target), { recursive: true });

            execFileSync('curl', [
              '-L', '--fail', '--silent', '--show-error',
              '--retry', '3', '--retry-delay', '2', '--retry-all-errors',
              rec.url, '-o', temp,
            ], { stdio: 'inherit' });

            const stat = fs.statSync(temp);
            if (stat.size < 10000) throw new Error(`Downloaded file is implausibly small: ${target} (${stat.size} bytes)`);

            const info = getImageInfo(temp);
            if (!info.mime.startsWith('image/')) throw new Error(`Invalid MIME: ${target} (${info.mime})`);
            if (path.extname(target).toLowerCase() === '.png' && info.mime !== 'image/png') {
              throw new Error(`Extension/MIME mismatch: ${target} (${info.mime})`);
            }
            if (info.width < 1 || info.height < 1) throw new Error(`Invalid dimensions: ${target}`);

            const hash = sha256(temp);
            if (existingHashes.has(hash)) {
              duplicate++;
              console.log(`SKIP_DUPLICATE #${rec.index} -> ${existingHashes.get(hash)}`);
              fs.unlinkSync(temp);
              continue;
            }

            if (fs.existsSync(target)) {
              const current = sha256(target);
              if (current === hash) {
                duplicate++;
                console.log(`SKIP_EXISTING #${rec.index} -> ${target}`);
                fs.unlinkSync(temp);
                existingHashes.set(hash, target);
                continue;
              }
              throw new Error(`Target path collision with different content: ${target}`);
            }

            fs.renameSync(temp, target);
            const metadata = {
              title: rec.title,
              description: rec.description,
              category: rec.category,
              tags: rec.tags,
              createdAt: rec.createdAt,
              featured: rec.featured,
              width: info.width,
              height: info.height,
              sourceHash: hash,
              sourceType: 'ChatGPT Images original',
              conversationImageIndex: rec.index
            };
            fs.writeFileSync(target.replace(/\.[^.]+$/, '.json'), JSON.stringify(metadata, null, 2) + '\n');
            existingHashes.set(hash, target);
            imported++;
            importedPaths.push(target);
            console.log(`IMPORTED #${rec.index} ${target} ${info.width}x${info.height} ${hash}`);
          }

          console.log(JSON.stringify({
            discovered: records.length,
            imported,
            duplicate,
            failed: 0,
            importedPaths
          }, null, 2));
          NODE

      - name: Generate gallery index
        run: npm run generate

      - name: Commit imported images and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-generated-20260731-154500.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/red-robed-immortal data/gallery.json .github/workflows/import-generated-20260731-154500.yml
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git commit -m "feat(gallery): import generated images from current conversation"
          git push origin HEAD:main
