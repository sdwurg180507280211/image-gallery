name: Add dedicated landscape thumbnails once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-landscape-thumbnails-once.yml

permissions:
  contents: write

concurrency:
  group: landscape-thumbnail-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add 1280px landscape thumbnail generation
        run: |
          python3 <<'PY'
          from pathlib import Path

          generator = Path('scripts/generate-gallery.mjs')
          source = generator.read_text(encoding='utf-8')

          replacements = [
            (
              "const thumbnailWidth = 640;\nconst thumbnailQuality = 78;",
              "const thumbnailWidth = 640;\nconst thumbnailQuality = 78;\nconst landscapeThumbnailWidth = 1280;\nconst landscapeThumbnailQuality = 84;"
            ),
            (
              "function thumbnailNameFor(sourceSha256) {\n  return `${createHash('sha256').update(`thumbnail-v2|width=${thumbnailWidth}|quality=${thumbnailQuality}|${sourceSha256}`).digest('hex').slice(0, 32)}.webp`;\n}",
              "function thumbnailNameFor(sourceSha256, width = thumbnailWidth, quality = thumbnailQuality) {\n  return `${createHash('sha256').update(`thumbnail-v2|width=${width}|quality=${quality}|${sourceSha256}`).digest('hex').slice(0, 32)}.webp`;\n}"
            ),
            (
              "async function generateThumbnail(absolutePath, cachePath) {",
              "async function generateThumbnail(absolutePath, cachePath, width = thumbnailWidth, quality = thumbnailQuality) {"
            ),
            (
              ".rotate().resize({ width: thumbnailWidth, withoutEnlargement: true })\n      .webp({ quality: thumbnailQuality, effort: 4, smartSubsample: true }).toFile(temporaryPath);",
              ".rotate().resize({ width, withoutEnlargement: true })\n      .webp({ quality, effort: 4, smartSubsample: true }).toFile(temporaryPath);"
            ),
            (
              "async function ensureThumbnail(absolutePath, thumbnailName) {",
              "async function ensureThumbnail(absolutePath, thumbnailName, width = thumbnailWidth, quality = thumbnailQuality) {"
            ),
            (
              "    await generateThumbnail(absolutePath, cachePath);",
              "    await generateThumbnail(absolutePath, cachePath, width, quality);"
            ),
            (
              "  let thumbnail = relativePath;\n\n  try {\n    sourceDimensions = orientedDimensions(await sharp(absolutePath, { animated: false, failOn: 'none' }).metadata());\n    const thumbnailName = thumbnailNameFor(sourceSha256);\n    usedThumbnailNames.add(thumbnailName);\n    await ensureThumbnail(absolutePath, thumbnailName);\n    thumbnail = `${thumbnailPublicDirectory}/${thumbnailName}`;",
              "  let thumbnail = relativePath;\n  let thumbnailLarge;\n\n  try {\n    sourceDimensions = orientedDimensions(await sharp(absolutePath, { animated: false, failOn: 'none' }).metadata());\n    const thumbnailName = thumbnailNameFor(sourceSha256);\n    usedThumbnailNames.add(thumbnailName);\n    await ensureThumbnail(absolutePath, thumbnailName);\n    thumbnail = `${thumbnailPublicDirectory}/${thumbnailName}`;\n\n    const sourceRatio = sourceDimensions.height > 0 ? sourceDimensions.width / sourceDimensions.height : 0;\n    if (sourceRatio >= 1.15) {\n      const largeThumbnailName = thumbnailNameFor(sourceSha256, landscapeThumbnailWidth, landscapeThumbnailQuality);\n      usedThumbnailNames.add(largeThumbnailName);\n      await ensureThumbnail(absolutePath, largeThumbnailName, landscapeThumbnailWidth, landscapeThumbnailQuality);\n      thumbnailLarge = `${thumbnailPublicDirectory}/${largeThumbnailName}`;\n    }"
            ),
            (
              "    thumbnail,\n    title:",
              "    thumbnail,\n    thumbnailLarge,\n    title:"
            ),
            (
              "thumbnail: { width: thumbnailWidth, format: 'webp', quality: thumbnailQuality },",
              "thumbnail: { width: thumbnailWidth, landscapeWidth: landscapeThumbnailWidth, format: 'webp', quality: thumbnailQuality, landscapeQuality: landscapeThumbnailQuality },"
            ),
          ]

          for old, new in replacements:
            if old not in source:
              raise SystemExit(f'未找到待替换代码片段：{old[:90]}')
            source = source.replace(old, new, 1)

          generator.write_text(source, encoding='utf-8')

          module = Path('assets/orientation-layout.js')
          layout = module.read_text(encoding='utf-8')
          layout = layout.replace("const GALLERY_URL = './data/gallery.json?v=20260804-1405';", "const GALLERY_URL = './data/gallery.json?v=20260804-1415';")

          old_source = """  const thumbnail = normalizeAssetPath(record.thumbnail);
  const original = normalizeAssetPath(record.path);
  const originalWidth = Number(record.width) || Number(image.getAttribute('width')) || image.naturalWidth;
  if (!thumbnail || !original || !(originalWidth > 640)) return;

  image.srcset = `${encodeURI(thumbnail)} 640w, ${encodeURI(original)} ${originalWidth}w`;"""
          new_source = """  const thumbnail = normalizeAssetPath(record.thumbnail);
  const thumbnailLarge = normalizeAssetPath(record.thumbnailLarge);
  const sourceWidth = Number(record.width) || Number(image.getAttribute('width')) || image.naturalWidth;
  const largeWidth = Math.min(sourceWidth, 1280);
  if (!thumbnail || !thumbnailLarge || !(largeWidth > 640)) return;

  image.srcset = `${encodeURI(thumbnail)} 640w, ${encodeURI(thumbnailLarge)} ${largeWidth}w`;"""
          if old_source not in layout:
            raise SystemExit('未找到原图响应式候选逻辑。')
          layout = layout.replace(old_source, new_source, 1)
          module.write_text(layout, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('orientation-layout.js?v=20260804-1405', 'orientation-layout.js?v=20260804-1415')
          index.write_text(html, encoding='utf-8')
          PY

      - name: Generate and validate gallery
        run: |
          npm install --no-audit --no-fund
          npm run build
          node <<'NODE'
          const fs = require('node:fs');
          const gallery = JSON.parse(fs.readFileSync('data/gallery.json', 'utf8'));
          if (gallery.count !== 191 || gallery.images.length !== 191) {
            throw new Error(`图库数量异常：${gallery.count}/${gallery.images.length}`);
          }

          const landscape = gallery.images.filter((item) => Number(item.width) / Number(item.height) >= 1.15);
          const upgraded = landscape.filter((item) => item.thumbnailLarge);
          if (!landscape.length) throw new Error('未检测到横图，无法验证。');
          if (upgraded.length !== landscape.length) {
            throw new Error(`横图高清缩略图不完整：${upgraded.length}/${landscape.length}`);
          }
          if (upgraded.some((item) => item.thumbnailLarge === item.path)) {
            throw new Error('高清候选错误地指向原图。');
          }
          for (const item of upgraded) {
            const target = `dist/${item.thumbnailLarge}`;
            if (!fs.existsSync(target)) throw new Error(`缺少构建缩略图：${target}`);
          }

          const module = fs.readFileSync('dist/assets/orientation-layout.js', 'utf8');
          if (!module.includes('record.thumbnailLarge')) throw new Error('前端未使用高清缩略图字段。');
          if (module.includes('`${encodeURI(thumbnail)} 640w, ${encodeURI(original)}')) throw new Error('前端仍把原图作为首页候选。');
          if (!fs.readFileSync('dist/index.html', 'utf8').includes('orientation-layout.js?v=20260804-1415')) {
            throw new Error('页面缓存版本未更新。');
          }
          console.log(`验证通过：${landscape.length} 张横图均生成独立高清缩略图。`);
          NODE

      - name: Commit upgrade and self-clean
        run: |
          rm -f .github/workflows/add-landscape-thumbnails-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf(gallery): add dedicated landscape thumbnails"
          git push origin HEAD:main
