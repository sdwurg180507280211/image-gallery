      - name: Download Adobe originals and update metadata
        shell: bash
        run: |
          cat > /tmp/import-chatgpt-images.mjs <<'__SCRIPT__'
          import fs from "node:fs";
          import path from "node:path";
          import crypto from "node:crypto";
          import { execFileSync } from "node:child_process";
          import sharp from "sharp";

          const EXPECTED = 48;
          const manifest = JSON.parse(fs.readFileSync("/tmp/chatgpt-image-manifest.json", "utf8"));
          const galleryPath = "data/gallery.json";
          const promptIndexPath = "data/prompt-index.json";
          const gallery = JSON.parse(fs.readFileSync(galleryPath, "utf8"));
          const promptIndex = JSON.parse(fs.readFileSync(promptIndexPath, "utf8"));

          if (gallery.schemaVersion !== 3 || !Array.isArray(gallery.assets)) {
            throw new Error("data/gallery.json is not schemaVersion 3 with assets[]");
          }
          if (promptIndex.schemaVersion !== 1 || typeof promptIndex.assets !== "object" || !promptIndex.assets) {
            throw new Error("data/prompt-index.json is not schemaVersion 1 with assets{}");
          }
          if (!Array.isArray(manifest) || manifest.length !== EXPECTED) {
            throw new Error(`manifest count ${manifest?.length} != expected ${EXPECTED}`);
          }

          const allowedCategories = new Set(["multi-panel","black","red","pink","blue","white","purple","green","gold","other"]);
          const existingIds = new Set(gallery.assets.map(a => a.id));
          const existingPaths = new Set(gallery.assets.map(a => a.path));
          const batchIds = new Set();
          const batchPaths = new Set();

          for (const item of manifest) {
            if (item.domain !== "character") throw new Error(`invalid domain for ${item.order}`);
            if (!allowedCategories.has(item.category)) throw new Error(`invalid category ${item.category}`);
            if (!String(item.mediaType || "").startsWith("image/")) throw new Error(`invalid mediaType for ${item.order}`);
            if (!/^https:\/\/at\.adobe\.com\//.test(item.adobeAssetUrl)) throw new Error(`invalid Adobe bridge URL for ${item.order}`);
            if (!/^[0-9a-f]{12}$/.test(item.id)) throw new Error(`invalid id ${item.id}`);
            if (!item.path.startsWith(`images/${item.characterId}/${item.seriesSlug}/`) || item.path.includes("..")) {
              throw new Error(`unsafe or inconsistent path ${item.path}`);
            }
            if (existingIds.has(item.id) || batchIds.has(item.id)) throw new Error(`asset id collision ${item.id}`);
            if (existingPaths.has(item.path) || batchPaths.has(item.path)) throw new Error(`asset path collision ${item.path}`);
            const promptPath = `prompts/assets/${item.id}.md`;
            if (promptIndex.assets[item.id] || fs.existsSync(promptPath)) throw new Error(`prompt collision ${item.id}`);
            if (fs.existsSync(item.path)) throw new Error(`target file already exists ${item.path}`);
            batchIds.add(item.id);
            batchPaths.add(item.path);
          }

          const imported = [];
          for (const item of manifest) {
            fs.mkdirSync(path.dirname(item.path), { recursive: true });
            const tmpPath = `${item.path}.part`;

            const curlOutput = execFileSync("curl", [
              "-L", "--fail", "--silent", "--show-error",
              "--output", tmpPath,
              "--write-out", "%{http_code}\n%{content_type}\n",
              item.adobeAssetUrl,
            ], { encoding: "utf8" }).trim().split(/\r?\n/);

            const httpCode = Number(curlOutput[0] || 0);
            const headerType = String(curlOutput[1] || "").toLowerCase();
            if (httpCode < 200 || httpCode >= 300) throw new Error(`HTTP ${httpCode} for ${item.order}`);
            const st = fs.statSync(tmpPath);
            if (st.size < 1024) throw new Error(`download too small (${st.size}) for ${item.order}`);

            const fileType = execFileSync("file", ["--mime-type", "-b", tmpPath], { encoding: "utf8" }).trim().toLowerCase();
            if (!fileType.startsWith("image/")) throw new Error(`file MIME ${fileType} is not image for ${item.order}`);
            if (headerType && !(headerType.startsWith("image/") || headerType.startsWith("application/octet-stream"))) {
              throw new Error(`HTTP content-type ${headerType} is not image for ${item.order}`);
            }

            const meta = await sharp(tmpPath).metadata();
            if (!meta.width || !meta.height || !meta.format) throw new Error(`sharp could not identify ${item.order}`);
            fs.renameSync(tmpPath, item.path);

            const sha256 = crypto.createHash("sha256").update(fs.readFileSync(item.path)).digest("hex");
            console.log(`[${item.order}/${EXPECTED}] ${item.title}: ${meta.width}x${meta.height} ${fileType} ${st.size} bytes sha256=${sha256}`);

            gallery.assets.push({
              id: item.id,
              path: item.path,
              title: item.title,
              domain: item.domain,
              category: item.category,
              tags: item.tags,
              characterId: item.characterId,
              seriesSlug: item.seriesSlug,
              seriesId: item.seriesId,
              createdAt: item.createdAt,
            });

            const promptPath = `prompts/assets/${item.id}.md`;
            fs.mkdirSync(path.dirname(promptPath), { recursive: true });
            const md = `# ${item.title}

          > 提示词类型：reconstructed  
          > 关联人物：金饰花簪东方美人  
          > 历史依据：本会话生成成品 + 当前生成上下文重建

          ## 生成提示词

          ${item.prompt}
          `;
            fs.writeFileSync(promptPath, md, "utf8");
            promptIndex.assets[item.id] = { path: promptPath, kind: item.promptKind };
            imported.push(item);
          }

          fs.writeFileSync(galleryPath, JSON.stringify(gallery, null, 2) + "\n", "utf8");
          fs.writeFileSync(promptIndexPath, JSON.stringify(promptIndex, null, 2) + "\n", "utf8");

          if (imported.length !== EXPECTED) throw new Error(`imported count ${imported.length} != ${EXPECTED}`);
          for (const item of imported) {
            if (!fs.existsSync(item.path)) throw new Error(`missing image after import ${item.path}`);
            const p = `prompts/assets/${item.id}.md`;
            if (!fs.existsSync(p)) throw new Error(`missing prompt after import ${p}`);
          }
          console.log(`Prepared ${imported.length} image assets and prompt records.`);
          __SCRIPT__
          node /tmp/import-chatgpt-images.mjs

      - name: Build and validate gallery
        run: |
          npm run build
          node --input-type=module <<'__VERIFY__'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("/tmp/chatgpt-image-manifest.json", "utf8"));
          const gallery = JSON.parse(fs.readFileSync("data/gallery.json", "utf8"));
          const promptIndex = JSON.parse(fs.readFileSync("data/prompt-index.json", "utf8"));
          const byId = new Map(gallery.assets.map(a => [a.id, a]));
          for (const item of manifest) {
            const a = byId.get(item.id);
            if (!a || a.path !== item.path) throw new Error(`gallery verification failed for ${item.id}`);
            const p = promptIndex.assets[item.id];
            if (!p || p.kind !== "reconstructed" || !fs.existsSync(p.path)) throw new Error(`prompt verification failed for ${item.id}`);
            if (!fs.existsSync(item.path)) throw new Error(`image verification failed for ${item.id}`);
          }
          console.log(`Verified ${manifest.length} new assets after npm run build.`);
          __VERIFY__

      - name: Commit and push imported assets
        run: |
          git config user.name "chatgpt-image-importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gallery.json data/prompt-index.json prompts/assets \
            images/golden-floral-eastern-beauty/session-20260821-set-01 \
            images/golden-floral-eastern-beauty/session-20260825-set-02 \
            images/golden-floral-eastern-beauty/session-20260825-set-03 \
            images/golden-floral-eastern-beauty/session-20260825-set-04 \
            images/golden-floral-eastern-beauty/session-20260825-set-05
          test "$(git diff --cached --name-only | wc -l)" -ge 98
          git commit -m "Add 48 ChatGPT portrait assets via Adobe bridge"
          git push origin HEAD:main

      - name: Trigger Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
