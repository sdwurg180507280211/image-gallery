name: One-time import ChatGPT portrait batch 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-chat-images-20260828-1553.yml'

permissions:
  contents: write

concurrency:
  group: import-chatgpt-48-main
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Extract preserved manifest and importer into workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          src = Path('.github/tmp/import-chat-images-20260828-1553-source.yml').read_text(encoding='utf-8')
          manifest = src.split("cat > /tmp/chatgpt-image-manifest.json <<'__MANIFEST__'\n", 1)[1].split("\n          __MANIFEST__", 1)[0]
          script = src.split("cat > /tmp/import-chatgpt-images.mjs <<'__SCRIPT__'\n", 1)[1].split("\n          __SCRIPT__", 1)[0]
          Path('/tmp/chatgpt-image-manifest.json').write_text(textwrap.dedent(manifest) + '\n', encoding='utf-8')
          Path('.tmp-import-chatgpt-images.mjs').write_text(textwrap.dedent(script) + '\n', encoding='utf-8')
          PY

      - name: Patch manifest with refreshed Adobe URLs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          manifest_path = Path('/tmp/chatgpt-image-manifest.json')
          urls_path = Path('.github/tmp/import-chat-images-20260828-1553-fresh-urls.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          urls = json.loads(urls_path.read_text(encoding='utf-8'))
          if len(manifest) != 48 or len(urls) != 48:
              raise SystemExit(f'expected 48 manifest items and URLs, got {len(manifest)} / {len(urls)}')
          missing = []
          for item in manifest:
              url = urls.get(item['sourceFileId'])
              if not url:
                  missing.append(item['sourceFileId'])
              else:
                  item['adobeAssetUrl'] = url
          if missing:
              raise SystemExit(f'missing refreshed URLs: {missing}')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Patched 48 Adobe bridge URLs.')
          PY

      - name: Download Adobe originals and update metadata
        run: |
          node .tmp-import-chatgpt-images.mjs
          rm -f .tmp-import-chatgpt-images.mjs

      - name: Build and validate gallery
        run: |
          npm run build
          node --input-type=module <<'__VERIFY__'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("/tmp/chatgpt-image-manifest.json", "utf8"));
          const gallery = JSON.parse(fs.readFileSync("data/gallery.json", "utf8"));
          const promptIndex = JSON.parse(fs.readFileSync("data/prompt-index.json", "utf8"));
          const byId = new Map(gallery.assets.map(a => [a.id, a]));
          for (const item of manifest) {
            const a = byId.get(item.id);
            if (!a || a.path !== item.path) throw new Error(`gallery verification failed for ${item.id}`);
            const p = promptIndex.assets[item.id];
            if (!p || p.kind !== "reconstructed" || !fs.existsSync(p.path)) throw new Error(`prompt verification failed for ${item.id}`);
            if (!fs.existsSync(item.path)) throw new Error(`image verification failed for ${item.id}`);
          }
          console.log(`Verified ${manifest.length} new assets after npm run build.`);
          __VERIFY__

      - name: Commit and push imported assets to main
        run: |
          git config user.name "chatgpt-image-importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gallery.json data/prompt-index.json prompts/assets \
            images/golden-floral-eastern-beauty/session-20260821-set-01 \
            images/golden-floral-eastern-beauty/session-20260825-set-02 \
            images/golden-floral-eastern-beauty/session-20260825-set-03 \
            images/golden-floral-eastern-beauty/session-20260825-set-04 \
            images/golden-floral-eastern-beauty/session-20260825-set-05
          test "$(git diff --cached --name-only | wc -l)" -ge 98
          git commit -m "Add 48 ChatGPT portrait assets via Adobe bridge"
          git push origin HEAD:main

      - name: Verify files are on main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -f images/golden-floral-eastern-beauty/session-20260821-set-01/01-moonlit-blue-fantasy.png
          test -f images/golden-floral-eastern-beauty/session-20260825-set-05/10-cyberpunk-city-rain-black.png
