name: One-time import ChatGPT images via Adobe bridge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-chatgpt-images-20260821-2123.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Download, validate and register Adobe-bridged images
        run: |
          node --input-type=module <<'NODE'
