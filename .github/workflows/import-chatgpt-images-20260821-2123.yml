            ['樱花亭中执扇佳人.png','https://at.adobe.com/USrNzyigVfPrDagl'],
            ['樱花亭畔蓝衣佳人.png','https://at.adobe.com/jORUbGQQWqaRgkcR'],
            ['樱花阁楼上的蓝衣佳人.png','https://at.adobe.com/1uedwoWmMLKZSOhG'],
            ['金色夜宴_黑金华服美人.png','https://at.adobe.com/uTikIfGzoOdD5udk'],
            ['月光水境中的翡翠女神.png','https://at.adobe.com/sdvwrb8vBuo8NjuZ'],
            ['金蓝珠光舞者倩影.png','https://at.adobe.com/rqg0omgRaHf6yAkP'],
            ['樱花亭下回眸佳人.png','https://at.adobe.com/DiR4yyAwETkfmEa5'],
            ['沙漠金色夕阳下的蓝衣舞者.png','https://at.adobe.com/2yYOrAvbsDvqv7Hl'],
            ['冰晶宫殿中的冰雪女王.png','https://at.adobe.com/0N0lwrTKTUQoOtna'],
            ['古韵花影中的蓝裙佳人.png','https://at.adobe.com/gQqug5p2HiXnsROL'],
            ['璀璨都市夜色中的金饰佳人.png','https://at.adobe.com/azuOt3LF9rm7iky4'],
            ['烛光下的鎏金东方美人.png','https://at.adobe.com/phnOVBLcMEFxSLny'],
            ['樱花流光中的蓝衣仙子.png','https://at.adobe.com/zzPRhQDBXH8RInpE'],
            ['雪宫冬夜的蓝衣女王.png','https://at.adobe.com/fYpYFLrUNEQl8JcY'],
            ['花冠精灵的梦幻花园肖像.png','https://at.adobe.com/UdqOGmAM1OzZNkmX'],
            ['月下花灯舟夜回眸.png','https://at.adobe.com/wIRXzUr5ck4SeEyf']
          ];

          function categoryFor(name) {
            if (/黑白|黑金|夜色都市|都市夜色|霓虹/.test(name)) return 'black';
            if (/红金|绯红|歌剧|红梅|葡萄园|书斋|书香|圣诞|佳节|古寺|后台/.test(name)) return 'red';
            if (/紫藤|薰衣草/.test(name)) return 'purple';
            if (/翡翠|茶亭|荷塘|森林花影|萤火|月下兰舟|月下花灯舟/.test(name)) return 'green';
            if (/白色西装|优雅漫步|雪山阳台/.test(name)) return 'white';
            if (/花店/.test(name)) return 'pink';
            if (/蒸汽火车站|鎏金东方美人/.test(name)) return 'gold';
            return 'blue';
          }

          const galleryPath = 'data/gallery.json';
          const promptIndexPath = 'data/prompt-index.json';
          const gallery = JSON.parse(fs.readFileSync(galleryPath, 'utf8'));
          const promptIndex = JSON.parse(fs.readFileSync(promptIndexPath, 'utf8'));
          if (gallery.schemaVersion !== 3 || !Array.isArray(gallery.assets)) throw new Error('gallery schemaVersion 3 required');
          if (promptIndex.schemaVersion !== 1 || typeof promptIndex.assets !== 'object') throw new Error('prompt-index schemaVersion 1 required');

          fs.mkdirSync('.tmp/adobe-import', { recursive: true });
          fs.mkdirSync(batchRoot, { recursive: true });
          fs.mkdirSync('prompts/assets', { recursive: true });

          const added = [];
          let ordinal = 0;
          for (const [name, url] of items) {
            ordinal += 1;
            const tmp = `.tmp/adobe-import/${String(ordinal).padStart(3,'0')}.png`;
            const curl = spawnSync('curl', ['-L','--fail','--silent','--show-error','--retry','3','--retry-delay','2','--retry-all-errors',url,'-o',tmp], { stdio: 'inherit' });
            if (curl.status !== 0) throw new Error(`curl failed for ${name}`);
            const mime = spawnSync('file', ['-b','--mime-type',tmp], { encoding: 'utf8' }).stdout.trim();
            const size = fs.statSync(tmp).size;
            if (!mime.startsWith('image/')) throw new Error(`invalid MIME ${mime} for ${name}`);
            if (size < 1024) throw new Error(`file too small for ${name}: ${size}`);
            const meta = await sharp(tmp).metadata();
            if (!meta.width || !meta.height) throw new Error(`sharp cannot parse ${name}`);

            const bytes = fs.readFileSync(tmp);
            const id = crypto.createHash('sha256').update(bytes).digest('hex').slice(0,12);
            const finalPath = `${batchRoot}/${id}.png`;
            if (!fs.existsSync(finalPath)) fs.copyFileSync(tmp, finalPath);

            const title = name.replace(/\.png$/i,'').replaceAll('_',' ');
            const category = categoryFor(title);
            const existing = gallery.assets.find(a => a.id === id || a.path === finalPath);
            if (!existing) {
              gallery.assets.push({
                id,
                path: finalPath,
                title,
                domain: 'character',
                category,
                tags: ['东方美人时装肖像集','同一人物','竖版高分辨率肖像',title],
                createdAt
              });
              added.push(id);
            }

            const promptPath = `prompts/assets/${id}.md`;
            const prompt = `# ${title}\n\n> 提示词类型：reconstructed\n> 来源：2026-08-21 ChatGPT 当前会话生成图；未保存可逐字验证的原始 prompt，因此按项目规则重建。\n\n## 人物身份锚点\n\n保持同一位成年东方女性身份一致：保留稳定的面容特征、五官比例、杏仁形眼睛、眼神与整体神韵，黑色长发，精致高级的东方时装肖像气质。不要改变人物身份，不要生成近似但不同的人。\n\n## 本图重建提示词\n\n生成一张竖版高分辨率人物肖像，主题为「${title}」。人物服装主色按图库归类为 ${category}。在服装、配饰、动作、姿态、表情、色调、构图与场景中完整呈现该主题；保持同一人物身份和稳定五官比例，眼神清晰、有互动感。画面精致、高级、细节丰富，强调真实皮肤、发丝、珠宝、刺绣与面料质感，使用电影级光影、自然景深和高端时尚编辑风格。单图单人物，禁止拼图、重复人物、文字、水印。\n`;
            fs.writeFileSync(promptPath, prompt, 'utf8');
            promptIndex.assets[id] = { path: promptPath, kind: 'reconstructed' };
            console.log(`${ordinal}/${items.length} ${name} -> ${finalPath} ${meta.width}x${meta.height} ${mime} ${size}`);
          }

          fs.writeFileSync(galleryPath, JSON.stringify(gallery, null, 2) + '\n');
          fs.writeFileSync(promptIndexPath, JSON.stringify(promptIndex, null, 2) + '\n');
          fs.writeFileSync('.tmp/adobe-import/summary.json', JSON.stringify({ total: items.length, added }, null, 2));
          console.log(`Imported ${items.length} images; new gallery records: ${added.length}`);
          NODE
      - name: Build and validate gallery
        run: npm run build
      - name: Commit imported originals and metadata
        run: |
          rm -rf .tmp/adobe-import
          git rm .github/workflows/import-chatgpt-images-20260821-2123.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(gallery): import 69 ChatGPT images via Adobe bridge'
          git push origin HEAD:main
      - name: Explicitly dispatch Pages
        run: gh workflow run pages.yml --ref main

