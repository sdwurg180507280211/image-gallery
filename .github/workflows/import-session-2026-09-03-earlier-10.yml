name: One-time import remaining 10 portraits 2026-09-03

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-session-2026-09-03-earlier-10.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for latest-10 batch to land on main
        shell: bash
        run: |
          marker='images/oriental-fashion-beauty/session-2026-09-03-latest-10/portrait-001-34c08209.png'
          for i in $(seq 1 80); do
            git fetch origin main --quiet
            if git cat-file -e "origin/main:${marker}" 2>/dev/null; then
              echo 'latest-10 batch is present on main'
              git reset --hard origin/main
              exit 0
            fi
            echo "waiting for latest-10 batch ($i/80)"
            sleep 15
          done
          echo 'Timed out waiting for latest-10 batch' >&2
          exit 1
