name: Apply V2 audit metadata once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v2-audit-once.yml

permissions:
  contents: write

concurrency:
  group: apply-v2-audit-metadata
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install image tooling
        run: npm install --no-audit --no-fund

      - name: Apply merged 178-image V2 audit
        run: node scripts/apply-v2-audit.mjs

      - name: Rebuild and validate gallery
        run: npm run build

      - name: Commit metadata migration and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v2-audit-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images data/gallery.json data/validation-report.json data/imports/v2-audit-apply-summary.json .github/workflows/apply-v2-audit-once.yml
          if git diff --cached --quiet; then
            echo "No V2 metadata changes required."
            exit 0
          fi
          git commit -m "feat(metadata): apply merged V2 audit to 178 images"
          git push origin HEAD:main
