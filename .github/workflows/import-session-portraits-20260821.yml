              tags: ['金饰花簪东方美人','黑金礼服','城市天台','夜景','互动视线'],
              prompt: `Create 1 vertical high-resolution portrait image using all reference images to lock the identity of the same woman. Image A, Image B, Image C, Image D, and Image E are all identity references of the same adult East Asian woman. Use them to preserve the same face, facial proportions, eye shape, nose, lips, skin tone, hairstyle language, overall aura, and especially the direct, captivating gaze and elegant refined spirit. Do not copy the exact original outfits or plain studio setup. Generate a new original artwork. This first image should serve as the identity anchor and also be a final image in the series. Theme: spring night city rooftop glamour. Show the same woman leaning on a rooftop railing above a sparkling modern city at night, with cinematic bokeh lights behind her. She wears a luxurious black silk evening dress with subtle gold embroidery and fine red gemstone jewelry that echoes the references, plus an intricate gold-and-red hair ornament in her dark updo. Keep her expression confident, poised, slightly alluring, and unmistakably the same person. Composition: upper-body to mid-shot, vertical 2:3, elegant framing, rich detail, polished editorial lighting, premium fashion-photography feel. Make the image highly refined, detailed, and visually luxurious.`
            }
          ];

          const galleryPath = 'data/gallery.json';
          const promptIndexPath = 'data/prompt-index.json';
          const gallery = JSON.parse(fs.readFileSync(galleryPath, 'utf8'));
          const promptIndex = JSON.parse(fs.readFileSync(promptIndexPath, 'utf8'));
          if (gallery.schemaVersion !== 3 || !Array.isArray(gallery.assets)) throw new Error('gallery.json is not v3');
          if (promptIndex.schemaVersion !== 1 || !promptIndex.assets) throw new Error('prompt-index.json is invalid');

          const existingIds = new Set(gallery.assets.map(x => x.id));
          const existingPaths = new Set(gallery.assets.map(x => x.path));
          const importRecords = [];
          fs.mkdirSync('data/imports', {recursive: true});
          fs.mkdirSync('prompts/assets', {recursive: true});

          for (const item of items) {
            const rel = path.posix.join('images', characterSlug, item.dir, item.file);
            if (existingPaths.has(rel)) throw new Error(`asset path already exists: ${rel}`);
            fs.mkdirSync(path.dirname(rel), {recursive: true});
            execFileSync('curl', ['-L','--fail','--silent','--show-error','--retry','3','--retry-delay','2','--retry-all-errors', item.url, '-o', rel], {stdio: 'inherit'});

            const stat = fs.statSync(rel);
            if (stat.size < 1024) throw new Error(`download too small: ${rel}`);
            const mime = execFileSync('file', ['-b','--mime-type', rel], {encoding: 'utf8'}).trim();
            if (!mime.startsWith('image/')) throw new Error(`not an image: ${rel} => ${mime}`);
            const meta = await sharp(rel, {failOn: 'error'}).metadata();
            if (!(Number(meta.width) > 0 && Number(meta.height) > 0)) throw new Error(`sharp cannot parse: ${rel}`);

            const buffer = fs.readFileSync(rel);
            const sha256 = crypto.createHash('sha256').update(buffer).digest('hex');
            let len = 12;
            let id = sha256.slice(0, len);
            while (existingIds.has(id)) {
              len += 4;
              if (len > 64) throw new Error(`unable to allocate unique id for ${rel}`);
              id = sha256.slice(0, len);
            }
            existingIds.add(id);
            existingPaths.add(rel);

            gallery.assets.push({id, path: rel, title: item.title, domain: 'character', category: item.category, tags: item.tags, createdAt});
            const promptPath = `prompts/assets/${id}.md`;
            const promptBody = `# ${item.title}\n\n- kind: original\n- source: ChatGPT image generation in current session\n- character: 金饰花簪东方美人\n- importedVia: Adobe file bridge\n\n## Original generation prompt\n\n${item.prompt}\n`;
            fs.writeFileSync(promptPath, promptBody, 'utf8');
            promptIndex.assets[id] = {path: promptPath, kind: 'original'};
            importRecords.push({
              order: item.order,
              originalFileId: item.fileId,
              originalFileName: item.file,
              adobeAssetId: item.adobeAssetId,
              mediaType: mime,
              finalPath: rel,
              assetId: id,
              sha256,
              width: meta.width,
              height: meta.height,
              bytes: stat.size
            });
          }

          fs.writeFileSync(galleryPath, JSON.stringify(gallery, null, 2) + '\n', 'utf8');
          fs.writeFileSync(promptIndexPath, JSON.stringify(promptIndex, null, 2) + '\n', 'utf8');
          fs.writeFileSync('data/imports/session-portraits-20260821-adobe-bridge.json', JSON.stringify({
            schemaVersion: 1,
            batch: 'session-portraits-20260821',
            domain: 'character',
            characterSlug,
            transfer: 'Adobe asset_openai_file_upload -> presignedAssetUrl -> GitHub Actions curl',
            createdAt,
            assets: importRecords
          }, null, 2) + '\n', 'utf8');
          console.log(`Prepared ${importRecords.length} original images.`);
          NODE

      - name: Build and validate gallery
        run: npm run build

      - name: Commit imported originals and self-clean temporary importer
        shell: bash
        run: |
          rm -f .github/workflows/import-session-portraits-20260821.yml
          rm -f .github/import-session-portraits-20260821.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'feat(gallery): import 21 session portraits via Adobe bridge'
          git push origin HEAD:main
