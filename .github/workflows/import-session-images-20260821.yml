      - name: Download and validate originals from Adobe bridge
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r row; do
            url=$(jq -r '.url' <<<"$row")
            target=$(jq -r '.path' <<<"$row")
            expected=$(jq -r '.mediaType' <<<"$row")
            mkdir -p "$(dirname "$target")"
            curl -L --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors "$url" -o "$target"
            mime=$(file -b --mime-type "$target")
            size=$(wc -c < "$target")
            echo "$target -> $mime ($size bytes)"
            [[ "$mime" == image/* ]]
            [[ "$expected" == image/* ]]
            [[ "$size" -ge 1024 ]]
          done < <(jq -c '.[]' /tmp/import-assets.json)

      - name: Update gallery and prompt archive
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import sharp from 'sharp';

          const items = JSON.parse(fs.readFileSync('/tmp/import-assets.json', 'utf8'));
          const galleryPath = 'data/gallery.json';
          const promptIndexPath = 'data/prompt-index.json';
          const gallery = JSON.parse(fs.readFileSync(galleryPath, 'utf8'));
          const promptIndex = JSON.parse(fs.readFileSync(promptIndexPath, 'utf8'));

          if (gallery.schemaVersion !== 3 || !Array.isArray(gallery.assets)) throw new Error('gallery schemaVersion must be 3');
          if (promptIndex.schemaVersion !== 1 || !promptIndex.assets || Array.isArray(promptIndex.assets)) throw new Error('prompt-index schemaVersion must be 1');

          const existingIds = new Set(gallery.assets.map(a => a.id));
          const existingPaths = new Set(gallery.assets.map(a => a.path));

          for (const item of items) {
            const meta = await sharp(item.path, { failOn: 'none' }).rotate().metadata();
            if (!(Number(meta.width) > 0 && Number(meta.height) > 0)) throw new Error(`sharp cannot parse ${item.path}`);

            if (!existingIds.has(item.id) && !existingPaths.has(item.path)) {
              gallery.assets.push({
                id: item.id,
                path: item.path,
                title: item.title,
                domain: 'character',
                category: item.category,
                tags: item.tags,
                createdAt: item.createdAt
              });
              existingIds.add(item.id);
              existingPaths.add(item.path);
            }

            const promptPath = `prompts/assets/${item.id}.md`;
            fs.mkdirSync(path.dirname(promptPath), { recursive: true });
            const prompt = [
              `# ${item.title}`,
              '',
              '> 提示词类型：reconstructed  ',
              '> 关联人物：东方美人时装肖像集  ',
              '> 历史依据：本会话生成图 + 用户连续生成指令 + 画面主题重建',
              '',
              '## 生成提示词',
              '',
              '参考同一位成年东方女性人物，提取并保留稳定一致的面容特征、五官比例、眼神和整体神韵，确保与本组其他作品保持同一人物身份。',
              '',
              `本张主题为“${item.title}”。围绕该主题还原与成图一致的季节、场景、服装、配饰、动作、姿态、表情、主色调和构图。主题差异应明确，不仅更换背景，也要让服装材质、造型语言、人物动作、光线氛围和镜头表达形成独立作品感。`,
              '',
              '采用单人竖版高分辨率时装肖像，人物眼神具有清晰互动感，皮肤、发丝、首饰与服装纹理自然细腻，整体风格精致、高级、细节丰富，具有电影级人像摄影质感、自然景深和清晰主体层次。',
              '',
              '不要文字，不要水印，不要拼图，不要近似重复场景或造型，不要改变人物身份，不要过度磨皮，不要畸形肢体，不要多余手指。',
              ''
            ].join('\n');
            fs.writeFileSync(promptPath, prompt, 'utf8');
            promptIndex.assets[item.id] = { path: promptPath, kind: 'reconstructed' };
          }

          fs.writeFileSync(galleryPath, `${JSON.stringify(gallery, null, 2)}\n`, 'utf8');
          fs.writeFileSync(promptIndexPath, `${JSON.stringify(promptIndex, null, 2)}\n`, 'utf8');
          NODE

      - name: Build and validate gallery
        run: npm run build

      - name: Remove one-time workflow
        run: rm -f '.github/workflows/import-session-images-20260821.yml'

      - name: Commit import to main and dispatch Pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(gallery): import 42 session portraits via Adobe bridge'
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
