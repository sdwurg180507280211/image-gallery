      - name: Preflight structural conflicts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('.tmp/import-manifest.json', 'utf8'));
          const gallery = JSON.parse(fs.readFileSync('data/gallery.json', 'utf8'));
          if (gallery.schemaVersion !== 3) throw new Error('gallery schemaVersion must be 3');
          const ids = new Set(gallery.assets.map(a => a.id));
          const paths = new Set(gallery.assets.map(a => a.path));
          if (manifest.assets.length !== 10) throw new Error(`expected 10 assets, got ${manifest.assets.length}`);
          for (const a of manifest.assets) {
            if (ids.has(a.assetId)) throw new Error(`asset id collision: ${a.assetId}`);
            if (paths.has(a.path) || fs.existsSync(a.path)) throw new Error(`asset path collision: ${a.path}`);
            if (!a.presignedAssetUrl || !a.presignedAssetUrl.startsWith('https://')) throw new Error(`bad Adobe URL for ${a.title}`);
            if (!a.mediaType.startsWith('image/')) throw new Error(`bad media type for ${a.title}`);
          }
          console.log(`preflight ok for ${manifest.assets.length} new assets`);
          NODE
      - name: Download Adobe originals
        shell: bash
        run: |
          node <<'NODE' > .tmp/downloads.tsv
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('.tmp/import-manifest.json','utf8'));
          for (const a of m.assets) console.log([a.presignedAssetUrl, a.path, a.mediaType, a.title].join('\t'));
          NODE
          while IFS=$'\t' read -r url dest expected title; do
            mkdir -p "$(dirname "$dest")"
            echo "Downloading: $title"
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 -o "$dest" "$url"
            size=$(stat -c%s "$dest")
            if [ "$size" -lt 10000 ]; then echo "File too small: $dest ($size bytes)"; exit 1; fi
            actual=$(file -b --mime-type "$dest")
            case "$actual" in image/png|image/jpeg|image/webp) ;; *) echo "Unexpected MIME $actual for $dest"; exit 1;; esac
            echo "Saved $dest ($size bytes, $actual)"
          done < .tmp/downloads.tsv
      - name: Validate images with sharp
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');
          const m = JSON.parse(fs.readFileSync('.tmp/import-manifest.json','utf8'));
          (async () => {
            for (const a of m.assets) {
              const meta = await sharp(a.path).metadata();
              if (!meta.width || !meta.height) throw new Error(`sharp could not read dimensions: ${a.path}`);
              console.log(`${a.assetId} ${meta.width}x${meta.height} ${meta.format}`);
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Update gallery and prompts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const manifest = JSON.parse(fs.readFileSync('.tmp/import-manifest.json','utf8'));
          const galleryPath = 'data/gallery.json';
          const promptIndexPath = 'data/prompt-index.json';
          const gallery = JSON.parse(fs.readFileSync(galleryPath,'utf8'));
          const promptIndex = JSON.parse(fs.readFileSync(promptIndexPath,'utf8'));
          if (!promptIndex.assets || promptIndex.schemaVersion !== 1) throw new Error('unexpected prompt-index schema');
          for (const a of manifest.assets) {
            gallery.assets.push({id:a.assetId,path:a.path,title:a.title,domain:a.domain,category:a.category,tags:a.tags,createdAt:manifest.createdAt,characterId:a.characterId,seriesSlug:a.seriesSlug,seriesId:a.seriesId});
            const promptPath = `prompts/assets/${a.assetId}.md`;
            if (fs.existsSync(promptPath)) throw new Error(`prompt path collision: ${promptPath}`);
            const md = `# ${a.title}\n\n> 提示词类型：reconstructed  \n> 来源：当前 ChatGPT 会话最新生成成品，根据可见画面与可靠生成上下文重建  \n> 关联人物：东方美人时装肖像集\n\n## 重建提示词\n\n${a.prompt}\n`;
            fs.mkdirSync(path.dirname(promptPath), {recursive:true});
            fs.writeFileSync(promptPath, md, 'utf8');
            promptIndex.assets[a.assetId] = {path:promptPath,kind:'reconstructed'};
          }
          fs.writeFileSync(galleryPath, JSON.stringify(gallery,null,2)+'\n','utf8');
          fs.writeFileSync(promptIndexPath, JSON.stringify(promptIndex,null,2)+'\n','utf8');
          NODE
      - name: Batch consistency check
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('.tmp/import-manifest.json','utf8'));
          const g = JSON.parse(fs.readFileSync('data/gallery.json','utf8'));
          const p = JSON.parse(fs.readFileSync('data/prompt-index.json','utf8'));
          const ids = m.assets.map(a => a.assetId);
          if (ids.length !== 10 || new Set(ids).size !== 10) throw new Error('manifest ID count mismatch');
          for (const a of m.assets) {
            if (!fs.existsSync(a.path)) throw new Error(`missing image: ${a.path}`);
            const matches = g.assets.filter(x => x.id === a.assetId);
            if (matches.length !== 1) throw new Error(`gallery id count mismatch for ${a.assetId}: ${matches.length}`);
            if (!p.assets[a.assetId]) throw new Error(`missing prompt index: ${a.assetId}`);
            if (!fs.existsSync(p.assets[a.assetId].path)) throw new Error(`missing prompt file: ${a.assetId}`);
          }
          console.log('batch consistency ok: 10/10');
          NODE
