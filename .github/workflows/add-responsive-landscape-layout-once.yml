name: Add landscape-aware gallery layout once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-responsive-landscape-layout-once.yml

permissions:
  contents: write

concurrency:
  group: landscape-aware-layout
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add orientation-aware card layout
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = '20260804-1355';

          let app = fs.readFileSync('assets/app.js', 'utf8');
          const oldBlock = `    if (item.width > 0 && item.height > 0) {
      card.style.setProperty('--image-ratio', String(Math.min(1.45, Math.max(0.68, item.width / item.height))));
      image.width = item.width;
      image.height = item.height;
    }`;
          const newBlock = `    if (item.width > 0 && item.height > 0) {
      const ratio = item.width / item.height;
      const displayRatio = Math.min(2.8, Math.max(0.68, ratio));
      const orientation = ratio >= 2.15
        ? 'panorama'
        : ratio >= 1.15
          ? 'landscape'
          : ratio >= 0.92
            ? 'square'
            : 'portrait';

      card.classList.add(\`is-\${orientation}\`);
      card.dataset.orientation = orientation;
      card.style.setProperty('--image-ratio', String(displayRatio));
      image.width = item.width;
      image.height = item.height;
    }`;

          if (!app.includes(oldBlock)) throw new Error('未找到图片比例逻辑，停止修改。');
          app = app.replace(oldBlock, newBlock);
          fs.writeFileSync('assets/app.js', app);

          let css = fs.readFileSync('assets/v2.css', 'utf8');
          const marker = '/* Landscape-aware desktop gallery v1 */';
          if (!css.includes(marker)) {
            css += `\n\n${marker}\n@media (min-width: 1121px) {\n  .gallery-grid {\n    grid-auto-flow: dense;\n    align-items: start;\n  }\n\n  .gallery-card {\n    align-self: start;\n  }\n\n  .gallery-card.is-landscape {\n    grid-column: span 2;\n  }\n\n  .gallery-card.is-panorama {\n    grid-column: 1 / -1;\n  }\n\n  .gallery-card.is-landscape .image-button,\n  .gallery-card.is-panorama .image-button {\n    aspect-ratio: var(--image-ratio);\n  }\n\n  .gallery-card.is-landscape .image-button img,\n  .gallery-card.is-panorama .image-button img {\n    object-position: center;\n  }\n\n  .gallery-card.is-landscape .card-body,\n  .gallery-card.is-panorama .card-body {\n    padding-top: 16px;\n  }\n\n  .gallery-card.is-panorama .card-title {\n    font-size: 17px;\n  }\n}\n`;
          }
          fs.writeFileSync('assets/v2.css', css);

          let html = fs.readFileSync('index.html', 'utf8');
          html = html.replace(/\.\/assets\/v2\.css(?:\?v=[^"']+)?/g, `./assets/v2.css?v=${version}`);
          html = html.replace(/\.\/assets\/app\.js(?:\?v=[^"']+)?/g, `./assets/app.js?v=${version}`);
          html = html.replace(/\.\/assets\/delete-admin\.js(?:\?v=[^"']+)?/g, `./assets/delete-admin.js?v=${version}`);
          fs.writeFileSync('index.html', html);

          if (!app.includes("card.classList.add(`is-${orientation}`)")) throw new Error('方向分类逻辑未写入。');
          if (!css.includes('.gallery-card.is-landscape')) throw new Error('横图布局样式未写入。');
          if (!css.includes('.gallery-card.is-panorama')) throw new Error('超宽图布局样式未写入。');
          NODE

      - name: Build and validate
        run: |
          npm install --no-audit --no-fund
          npm run build
          node <<'NODE'
          const fs = require('node:fs');
          const gallery = JSON.parse(fs.readFileSync('dist/data/gallery.json', 'utf8'));
          if (gallery.count !== 191 || gallery.images.length !== 191) {
            throw new Error(`构建后图库数量异常：${gallery.count}/${gallery.images.length}`);
          }
          const app = fs.readFileSync('dist/assets/app.js', 'utf8');
          const css = fs.readFileSync('dist/assets/v2.css', 'utf8');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          if (!app.includes("orientation = ratio >= 2.15")) throw new Error('构建产物缺少方向判断。');
          if (!css.includes('grid-column: span 2')) throw new Error('构建产物缺少横图跨列样式。');
          if (!css.includes('grid-column: 1 / -1')) throw new Error('构建产物缺少全宽图样式。');
          if (!html.includes('app.js?v=20260804-1355')) throw new Error('首页脚本版本未更新。');
          if (!html.includes('v2.css?v=20260804-1355')) throw new Error('首页样式版本未更新。');
          console.log('横竖图自适应布局构建验证通过。');
          NODE

      - name: Commit and self-clean
        run: |
          rm -f .github/workflows/add-responsive-landscape-layout-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(gallery): support landscape and panorama cards"
          git push origin HEAD:main
