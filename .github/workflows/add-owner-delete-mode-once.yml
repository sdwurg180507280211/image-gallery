          replaceOnce('assets/app.js',
`function initializeTheme() {`,
`function setDeleteStatus(message, isError = false) {
  elements.deleteStatus.textContent = message;
  elements.deleteStatus.classList.toggle('error', isError);
}

function setDeleteControlsBusy(busy) {
  document.querySelectorAll('.delete-button, #lightboxDelete, #deleteUnlock, #deleteLock').forEach((button) => {
    button.disabled = busy;
  });
}

function encodeRepositoryPath(value) {
  return value.split('/').map(encodeURIComponent).join('/');
}

function decodeBase64Utf8(value) {
  const binary = atob(String(value || '').replace(/\\s/g, ''));
  const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

async function githubRequest(endpoint, { method = 'GET', body, token = state.deleteToken } = {}) {
  const response = await fetch(\`https://api.github.com\${endpoint}\`, {
    method,
    headers: {
      Accept: 'application/vnd.github+json',
      Authorization: \`Bearer \${token}\`,
      'X-GitHub-Api-Version': '2022-11-28',
      ...(body ? { 'Content-Type': 'application/json' } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await response.text();
  const data = text ? JSON.parse(text) : {};
  if (!response.ok) {
    const error = new Error(data.message || \`GitHub API 请求失败：\${response.status}\`);
    error.status = response.status;
    throw error;
  }
  return data;
}

async function repositoryPathExists(repositoryPath) {
  try {
    await githubRequest(\`/repos/\${GITHUB_REPOSITORY}/contents/\${encodeRepositoryPath(repositoryPath)}?ref=\${encodeURIComponent(GITHUB_BRANCH)}\`);
    return true;
  } catch (error) {
    if (error.status === 404) return false;
    throw error;
  }
}

async function jsonBlobEntry(repositoryPath, transform) {
  const file = await githubRequest(\`/repos/\${GITHUB_REPOSITORY}/contents/\${encodeRepositoryPath(repositoryPath)}?ref=\${encodeURIComponent(GITHUB_BRANCH)}\`);
  const document = JSON.parse(decodeBase64Utf8(file.content));
  const updated = transform(document);
  const blob = await githubRequest(\`/repos/\${GITHUB_REPOSITORY}/git/blobs\`, {
    method: 'POST',
    body: { content: \`\${JSON.stringify(updated, null, 2)}\\n\`, encoding: 'utf-8' },
  });
  return { path: repositoryPath, mode: '100644', type: 'blob', sha: blob.sha };
}

async function deleteImageFromRepository(item, sourceButton) {
  if (!state.deleteMode || !state.deleteToken || state.deleteBusy) return;
  state.deleteBusy = true;
  setDeleteControlsBusy(true);
  sourceButton.textContent = '删除中…';
  setDeleteStatus(\`正在永久删除「\${item.title}」…\`);

  try {
    const head = await githubRequest(\`/repos/\${GITHUB_REPOSITORY}/git/ref/heads/\${GITHUB_BRANCH}\`);
    const headSha = head.object.sha;
    const commit = await githubRequest(\`/repos/\${GITHUB_REPOSITORY}/git/commits/\${headSha}\`);
    const metadataPath = item.path.replace(/\\.[^.]+$/, '.json');
    const imageExists = await repositoryPathExists(item.path);
    if (!imageExists) throw new Error('仓库中的原图已经不存在。');
    const metadataExists = await repositoryPathExists(metadataPath);
    const now = new Date().toISOString();
    let remainingCount = state.images.length - 1;

    const treeEntries = [
      { path: item.path, mode: '100644', type: 'blob', sha: null },
      ...(metadataExists ? [{ path: metadataPath, mode: '100644', type: 'blob', sha: null }] : []),
      await jsonBlobEntry('data/gallery.json', (gallery) => {
        gallery.images = (gallery.images || []).filter((image) => image.id !== item.id && image.path !== item.path);
        gallery.count = gallery.images.length;
        gallery.generatedAt = now;
        remainingCount = gallery.count;
        return gallery;
      }),
      await jsonBlobEntry('data/validation-report.json', (report) => {
        report.generatedAt = now;
        report.issues = (report.issues || []).filter((issue) => issue.path !== item.path);
        report.summary = report.summary || {};
        report.summary.images = remainingCount;
        report.summary.errors = report.issues.filter((issue) => issue.severity === 'error').length;
        report.summary.warnings = report.issues.filter((issue) => issue.severity === 'warning').length;
        report.summary.info = report.issues.filter((issue) => issue.severity === 'info').length;
        return report;
      }),
    ];

    const tree = await githubRequest(\`/repos/\${GITHUB_REPOSITORY}/git/trees\`, {
      method: 'POST',
      body: { base_tree: commit.tree.sha, tree: treeEntries },
    });
    const deletionCommit = await githubRequest(\`/repos/\${GITHUB_REPOSITORY}/git/commits\`, {
      method: 'POST',
      body: {
        message: \`chore(gallery): delete \${item.title}\`,
        tree: tree.sha,
        parents: [headSha],
      },
    });
    await githubRequest(\`/repos/\${GITHUB_REPOSITORY}/git/refs/heads/\${GITHUB_BRANCH}\`, {
      method: 'PATCH',
      body: { sha: deletionCommit.sha, force: false },
    });

    state.images = state.images.filter((image) => image.id !== item.id && image.path !== item.path);
    state.favorites.delete(item.id);
    localStorage.setItem('image-gallery:favorites', JSON.stringify([...state.favorites]));
    if (elements.lightbox.open) closeLightbox();
    updateStats();
    renderCharacters();
    renderFacetFilters();
    applyFilters();
    setDeleteStatus(\`已删除「\${item.title}」。原图和同名 JSON 已从 main 分支移除，页面正在自动重新部署。\`);
  } catch (error) {
    console.error('删除失败：', error);
    sourceButton.textContent = '删除';
    setDeleteStatus(\`删除失败：\${error.message}\`, true);
  } finally {
    state.deleteBusy = false;
    setDeleteControlsBusy(false);
  }
}

async function unlockDeleteMode() {
  const token = elements.deleteToken.value.trim();
  if (!token) {
    setDeleteStatus('请输入 GitHub fine-grained token。', true);
    return;
  }
  state.deleteBusy = true;
  setDeleteControlsBusy(true);
  setDeleteStatus('正在验证仓库访问权限…');
  try {
    state.deleteToken = token;
    await githubRequest(\`/repos/\${GITHUB_REPOSITORY}\`);
    state.deleteMode = true;
    elements.deleteToken.value = '';
    elements.deleteToken.hidden = true;
    elements.deleteUnlock.hidden = true;
    elements.deleteLock.hidden = false;
    elements.deleteModeToggle.setAttribute('aria-pressed', 'true');
    setDeleteStatus('删除模式已开启。点击任意红色删除按钮会立即执行，不弹确认框。');
    renderGallery();
    if (elements.lightbox.open) renderLightbox();
  } catch (error) {
    state.deleteToken = '';
    setDeleteStatus(\`令牌验证失败：\${error.message}\`, true);
  } finally {
    state.deleteBusy = false;
    setDeleteControlsBusy(false);
  }
}

function lockDeleteMode() {
  state.deleteMode = false;
  state.deleteToken = '';
  elements.deleteToken.hidden = false;
  elements.deleteUnlock.hidden = false;
  elements.deleteLock.hidden = true;
  elements.deleteModeToggle.setAttribute('aria-pressed', 'false');
  setDeleteStatus('删除模式已关闭，令牌已从页面内存清除。');
  renderGallery();
  if (elements.lightbox.open) renderLightbox();
}

function initializeTheme() {`);

