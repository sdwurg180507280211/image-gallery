name: Add owner delete mode once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-owner-delete-mode-once.yml

permissions:
  contents: write

concurrency:
  group: add-owner-delete-mode
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add secure owner delete controls
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(file, before, after) {
            let source = fs.readFileSync(file, 'utf8');
            if (!source.includes(before)) throw new Error(`${file}: expected block not found`);
            source = source.replace(before, after);
            fs.writeFileSync(file, source);
          }

