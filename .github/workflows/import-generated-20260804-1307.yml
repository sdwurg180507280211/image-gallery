name: Import generated spring garden images 20260804-1307

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-generated-20260804-1307.yml'

permissions:
  contents: write

concurrency:
  group: image-gallery-import
  cancel-in-progress: false

jobs:
  import-generated-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download images and write Metadata V2
        env:
          IMPORT_MANIFEST_GZIP_BASE64: ''
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { gunzipSync } from 'node:zlib';
          import { mkdirSync, statSync, writeFileSync } from 'node:fs';
          import path from 'node:path';

          const json = gunzipSync(Buffer.from(process.env.IMPORT_MANIFEST_GZIP_BASE64, 'base64')).toString('utf8');
          const manifest = JSON.parse(json);
          for (const item of manifest) {
            mkdirSync(path.dirname(item.imagePath), { recursive: true });
            execFileSync('curl', [
              '-L', '--fail', '--silent', '--show-error',
              '--retry', '3', '--retry-delay', '2', '--retry-all-errors',
              item.url, '-o', item.imagePath,
            ], { stdio: 'inherit' });

            const size = statSync(item.imagePath).size;
            const mime = execFileSync('file', ['-b', '--mime-type', item.imagePath], { encoding: 'utf8' }).trim();
            if (!mime.startsWith('image/')) throw new Error(`下载结果不是图片：${item.imagePath}，MIME=${mime}`);
            if (size < 1024) throw new Error(`图片文件过小：${item.imagePath}，SIZE=${size}`);

            const sidecarPath = item.imagePath.replace(/\.[^.]+$/, '.json');
            writeFileSync(sidecarPath, `${JSON.stringify(item.metadata, null, 2)}\n`, 'utf8');
          }
          console.log(`已下载并写入 ${manifest.length} 张图片及 Metadata V2。`);
          NODE

      - name: Generate gallery data
        run: npm run generate

      - name: Check validation report
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('data/validation-report.json', 'utf8'));
          const errors = Number(report.summary?.errors ?? report.errors ?? 0);
          const warnings = Number(report.summary?.warnings ?? report.warnings ?? 0);
          console.log(`Metadata V2 validation: errors=${errors}, warnings=${warnings}`);
          if (errors > 0) process.exit(1);
          NODE

      - name: Remove temporary workflow
        run: rm -f '.github/workflows/import-generated-20260804-1307.yml'

      - name: Commit and push imported gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "没有可提交内容。"
            exit 0
          fi

          git commit -m "feat(gallery): import generated images from current conversation"
          git pull --rebase origin main

          npm run generate
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('data/validation-report.json', 'utf8'));
          const errors = Number(report.summary?.errors ?? report.errors ?? 0);
          if (errors > 0) process.exit(1);
          NODE

          git add -A
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          git push origin HEAD:main
