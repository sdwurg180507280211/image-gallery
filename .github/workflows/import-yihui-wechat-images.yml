name: Import Yihui WeChat brand images

# execution trigger: 2026-08-20
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-yihui-wechat-images.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: Download and validate source images
        env:
          LOGO_HEART_MOTHER: https://at.adobe.com/irMtcqVd4AhrnQbY
          LOGO_HEART_RIBBON: https://at.adobe.com/pAzcUfYkeBRB9cGt
          LOGO_MOTHER_CHILD_ROUND: https://at.adobe.com/Fk2uijTt2HXqsxiT
          LOGO_FEMALE_FLORAL: https://at.adobe.com/D7kkdJgY28IGxj3h
          KV_HORIZONTAL: https://at.adobe.com/PRjySAvTsywEPfme
          KV_VERTICAL: https://at.adobe.com/40vwLSR7vCfbs2cu
        run: |
          set -euo pipefail
          target='images/wechat/yihui-she-health'
          mkdir -p "$target"
          download() {
            local url="$1" name="$2"
            local path="$target/$name"
            curl -L --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors "$url" -o "$path"
            mime=$(file -b --mime-type "$path")
            size=$(wc -c < "$path")
            [[ "$mime" == image/* ]]
            [[ "$size" -ge 1024 ]]
          }
          download "$LOGO_HEART_MOTHER" 'yihui-she-health-logo-heart-mother.png'
          download "$LOGO_HEART_RIBBON" 'yihui-she-health-logo-heart-ribbon.png'
          download "$LOGO_MOTHER_CHILD_ROUND" 'yihui-she-health-logo-mother-child-round.png'
          download "$LOGO_FEMALE_FLORAL" 'yihui-she-health-logo-female-floral.png'
          download "$KV_HORIZONTAL" 'yihui-she-health-kv-horizontal-horse-year.png'
          download "$KV_VERTICAL" 'yihui-she-health-kv-vertical-horse-year.png'
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import {readdir} from 'node:fs/promises';
          const dir='images/wechat/yihui-she-health';
          for(const name of await readdir(dir)){
            if(!name.endsWith('.png')) continue;
            const meta=await sharp(`${dir}/${name}`,{failOn:'none'}).metadata();
            if(!(meta.width>0&&meta.height>0)) throw new Error(`无法解析图片：${name}`);
            console.log(`${name}: ${meta.width}x${meta.height}`);
          }
          NODE
      - name: Replace WeChat image components
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const componentPath='wechat/index.html';
          let source=await readFile(componentPath,'utf8');
          const match=source.match(/const COMPONENTS=(\[.*?\]);const cats=/s);
          if(!match) throw new Error('无法读取公众号组件列表');
          let components=JSON.parse(match[1]).filter(item=>item.category!=='图片');
          const base='https://sdwurg180507280211.github.io/image-gallery/images/wechat/yihui-she-health';
          const imageComponents=[
            {id:'图片-01',category:'图片',name:'医荟她健康 Logo｜心形女性与医疗十字',html:`<section style="text-align:center;margin:12px 0;"><img src="${base}/yihui-she-health-logo-heart-mother.png" alt="医荟她健康 Logo｜心形女性与医疗十字" style="display:block;width:100%;max-width:560px;height:auto;margin:0 auto;"></section>`},
            {id:'图片-02',category:'图片',name:'医荟她健康 Logo｜爱心飘带女性',html:`<section style="text-align:center;margin:12px 0;"><img src="${base}/yihui-she-health-logo-heart-ribbon.png" alt="医荟她健康 Logo｜爱心飘带女性" style="display:block;width:100%;max-width:560px;height:auto;margin:0 auto;"></section>`},
            {id:'图片-03',category:'图片',name:'医荟她健康 Logo｜母女圆形徽章',html:`<section style="text-align:center;margin:12px 0;"><img src="${base}/yihui-she-health-logo-mother-child-round.png" alt="医荟她健康 Logo｜母女圆形徽章" style="display:block;width:100%;max-width:520px;height:auto;margin:0 auto;"></section>`},
            {id:'图片-04',category:'图片',name:'医荟她健康 Logo｜女性花瓣标识',html:`<section style="text-align:center;margin:12px 0;"><img src="${base}/yihui-she-health-logo-female-floral.png" alt="医荟她健康 Logo｜女性花瓣标识" style="display:block;width:100%;max-width:560px;height:auto;margin:0 auto;"></section>`},
            {id:'图片-05',category:'图片',name:'医荟她健康｜马年横版 KV',html:`<section style="line-height:0;margin:0;"><img src="${base}/yihui-she-health-kv-horizontal-horse-year.png" alt="医荟她健康 马年横版 KV" style="display:block;width:100%;max-width:100%;height:auto;margin:0;"></section>`},
            {id:'图片-06',category:'图片',name:'医荟她健康｜马年竖版 KV',html:`<section style="text-align:center;line-height:0;margin:0;"><img src="${base}/yihui-she-health-kv-vertical-horse-year.png" alt="医荟她健康 马年竖版 KV" style="display:block;width:100%;max-width:480px;height:auto;margin:0 auto;"></section>`}
          ];
          const insertAt=components.findIndex(item=>item.category==='参考文献');
          if(insertAt<0) throw new Error('未找到参考文献组件位置');
          components.splice(insertAt,0,...imageComponents);
          source=source.replace(match[0],`const COMPONENTS=${JSON.stringify(components)};const cats=`);
          source=source.replace('图片组件中的 URL 是占位符；正式文章生成时会替换为实际图片地址。品牌资产、小程序等不会自动加入。','图片组件均来自已入库的医荟她健康品牌素材；复制 HTML 后可直接复用。');
          await writeFile(componentPath,source,'utf8');

          const indexPath='index.html';
          let index=await readFile(indexPath,'utf8');
          index=index.replace(/(<button class="domain-tab" data-domain="wechat"[\s\S]*?<small>)\d+(<\/small>)/,'$126$2');
          await writeFile(indexPath,index,'utf8');
          console.log(`公众号组件总数：${components.length}`);
          NODE
      - name: Build and verify
        run: npm run build
      - name: Commit imported images
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/wechat/yihui-she-health wechat/index.html index.html
          git commit -m 'feat(wechat): import Yihui brand images'
          git push origin HEAD:main
