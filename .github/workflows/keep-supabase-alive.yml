name: Sync Cloud Dislikes

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch cloud dislike list
        run: |
          curl --fail --silent --show-error --retry 2 \
            https://xkuzzmqtboclgvkvdlwd.supabase.co/functions/v1/image-dislikes \
            -o data/dislikes.json
          node -e "const fs=require('fs');const p='data/dislikes.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));if(d.schemaVersion!==1||!Array.isArray(d.assetIds))process.exit(1);fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');"

      - name: Commit changes when needed
        run: |
          if git diff --quiet -- data/dislikes.json; then
            echo 'No dislike changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dislikes.json
          git commit -m 'chore(dislikes): sync cloud state'
          git push
