<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待复核图片 · Image Gallery</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:#0b0d12;color:#f4f5f7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#24151d 0,#0b0d12 38%);min-height:100vh}header{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:18px 5vw;background:rgba(11,13,18,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.1)}a{color:inherit;text-decoration:none}header a{font-weight:700}main{width:min(1500px,92vw);margin:0 auto;padding:42px 0 80px}h1{font-size:clamp(30px,5vw,58px);margin:0 0 12px}p{line-height:1.7;color:#b9bdc8}.summary{margin-bottom:30px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}.card{overflow:hidden;border:1px solid rgba(255,255,255,.11);border-radius:20px;background:rgba(22,24,31,.92);box-shadow:0 18px 40px rgba(0,0,0,.25)}.image-wrap{display:block;aspect-ratio:1/1;overflow:hidden;background:#171920}.image-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .25s}.image-wrap:hover img{transform:scale(1.025)}.body{padding:18px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#6f2637;color:#ffdbe4;font-size:12px;font-weight:700}.body h2{font-size:18px;margin:12px 0 8px}.reason{font-size:14px;color:#d7bac2;margin:0}.path{font-size:12px;color:#7f8592;word-break:break-all;margin-top:12px}.loading,.error{padding:50px 0;font-size:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.button{border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:10px 16px;background:#1a1d25;color:#fff;cursor:pointer}dialog{width:min(1200px,96vw);height:min(92vh,1000px);padding:0;border:0;border-radius:20px;background:#101218;color:#fff}dialog::backdrop{background:rgba(0,0,0,.82)}dialog img{width:100%;height:calc(100% - 70px);object-fit:contain;background:#07080b}.dialog-bar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.close{font-size:25px;background:transparent;border:0;color:#fff;cursor:pointer}
  </style>
</head>
<body>
  <header><a href="./">← 返回全部图库</a><strong>待复核图片</strong></header>
  <main>
    <section class="summary">
      <h1>13 张分类边界图片</h1>
      <p>这里仅展示元数据中标记为 <code>needsManualReview=true</code> 的作品。点击图片可查看原图，卡片下方会显示需要你判断的原因。</p>
      <div class="toolbar"><button class="button" id="reload" type="button">重新载入</button></div>
    </section>
    <div id="status" class="loading">正在读取待复核清单…</div>
    <section id="grid" class="grid" hidden></section>
  </main>
  <dialog id="viewer"><div class="dialog-bar"><strong id="viewerTitle"></strong><button class="close" id="close" type="button">×</button></div><img id="viewerImage" alt="" /></dialog>
  <script>
    const summaryUrl='./data/imports/v2-audit-apply-summary.json';
    const grid=document.querySelector('#grid');
    const status=document.querySelector('#status');
    const viewer=document.querySelector('#viewer');
    const viewerImage=document.querySelector('#viewerImage');
    const viewerTitle=document.querySelector('#viewerTitle');

    async function load(){
      status.hidden=false;grid.hidden=true;status.textContent='正在读取待复核清单…';grid.replaceChildren();
      try{
        const report=await fetch(summaryUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('清单读取失败 '+r.status);return r.json()});
        const items=(report.results||[]).filter(item=>item.needsManualReview);
        const details=await Promise.all(items.map(async item=>{
          try{const meta=await fetch('./'+item.metadataPath,{cache:'no-store'}).then(r=>r.json());return{...item,meta}}catch{return{...item,meta:{}}}
        }));
        for(const item of details){
          const meta=item.meta||{};
          const card=document.createElement('article');card.className='card';
          const link=document.createElement('button');link.className='image-wrap';link.type='button';link.style.border='0';link.style.padding='0';link.style.width='100%';link.style.cursor='zoom-in';
          const img=document.createElement('img');img.src=encodeURI('./'+item.repositoryPath);img.alt=meta.title||item.repositoryPath;img.loading='lazy';link.append(img);
          link.addEventListener('click',()=>{viewerImage.src=encodeURI('./'+item.repositoryPath);viewerImage.alt=img.alt;viewerTitle.textContent=img.alt;viewer.showModal()});
          const body=document.createElement('div');body.className='body';
          const badge=document.createElement('span');badge.className='badge';badge.textContent='⚠ 待人工复核';
          const title=document.createElement('h2');title.textContent=meta.title||item.repositoryPath.split('/').pop();
          const reason=document.createElement('p');reason.className='reason';reason.textContent=meta.manualReviewReason||'分类边界需要人工确认';
          const path=document.createElement('p');path.className='path';path.textContent=item.repositoryPath;
          body.append(badge,title,reason,path);card.append(link,body);grid.append(card);
        }
        status.textContent=items.length?`共 ${items.length} 张待复核图片`:'当前没有待复核图片';
        grid.hidden=!items.length;
      }catch(error){status.className='error';status.textContent='无法读取待复核页面：'+error.message}
    }
    document.querySelector('#reload').addEventListener('click',load);
    document.querySelector('#close').addEventListener('click',()=>viewer.close());
    viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});
    load();
  </script>
</body>
</html>
